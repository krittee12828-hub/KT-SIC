const Mirror = {
  map: new Map(), recs: new Map(), ln: 0,
  label(pid) { const m = this.map.get(pid); if (m && m.label) return m.label; const s = Live.students.get(pid); return s ? (s.label || s.name) : 'Mirror'; },
  sending(pid) { const m = this.map.get(pid); return !!(m && Live.stream && Live.stream === m.stream); },
  add(pid, stream, call) {
    const old = this.map.get(pid); if (old && old.stream !== stream && Live.stream === old.stream) Live.stopStream(true);
    this.map.set(pid, { stream, call }); if (!Win.has('mirrors')) this.win(pid); Live.emit(); toast('📲 ' + this.label(pid) + ' ' + T('ส่งภาพมิเรอร์แล้ว', 'is mirroring'), 'ok', 2200);
  },
  /* จับหน้าต่าง/จอบนคอมเครื่องนี้ — ใช้กับ iPad ที่ AirPlay หรือเสียบ USB (QuickTime) เข้ามาที่คอม */
  async addLocal() {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) return toast(T('เบราว์เซอร์นี้จับหน้าจอไม่ได้ — ใช้ Chrome/Edge/Firefox บนคอมพิวเตอร์', 'Screen capture is not supported here'), 'err', 4500);
    try {
      const st = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: false }); const id = 'local_' + (++this.ln);
      try { st.getVideoTracks()[0].contentHint = 'detail'; } catch (e) { }
      this.map.set(id, { stream: st, local: true, label: T('หน้าต่างบนคอมนี้', 'This computer') + ' ' + this.ln }); st.getVideoTracks()[0].addEventListener('ended', () => this.remove(id)); Live.emit();
    } catch (e) { if (e.name !== 'NotAllowedError') toast(T('จับหน้าจอไม่สำเร็จ: ', 'Capture failed: ') + e.message, 'err', 3500); }
  },
  remove(pid) { const m = this.map.get(pid); if (!m) return; this.map.delete(pid); try { const r = this.recs.get(pid); r && r.state !== 'inactive' && r.stop(); } catch (e) { } if (Live.stream === m.stream) Live.stopStream(); if (m.local) m.stream.getTracks().forEach(t => t.stop()); try { Win.close('m_' + pid); } catch (e) { } Live.emit(); },

  },
  vid(pid, v) { return v || document.querySelector(`[data-win="m_${pid}"] video`); },
  frame(pid, v) { v = this.vid(pid, v); if (!v || !v.videoWidth) { toast(T('ยังไม่มีภาพ', 'No frame yet'), 'err', 1800); return null; } const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0); return c; },
  stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); },

  async snap(pid, v) {

        }

  };
  window.addEventListener('beforeunload', () => { try { src.stop(true); } catch (e) { } });
  window.addEventListener('pagehide', e => { if (!e.persisted) { try { MClient.conn && MClient.conn.close(); } catch (x) { } } });      // ปิดแท็บ → แจ้ง Host ทันที
  setInterval(() => { if (joined) send({ t: 'm-hb' }); }, 5000);
  if (nameQ) { name = cleanName(nameQ, 30) || name; ls('sic.stuName', name); connect(); } else showJoin();
}

function bootMeetDisplay(code) {
  const app = $('#app'); app.className = ''; app.style.cssText = 'display:block;height:100%;overflow:hidden'; document.title = 'Meeting Display · ' + CONFIG.appName; document.body.classList.add('dsp-body');

  const dsp = $('#mdsp'), V = $('#mdV'); const pend = new Map(); let allowedP = new Set(), cur = null, curTm = 0, S = null, SAt = 0, lastMid = 0, banTm = 0, hudT = 0, fq = { t: 0, n: 0 };
  const fs = () => { const f = dsp.requestFullscreen || dsp.webkitRequestFullscreen; try { f && f.call(dsp); } catch (e) { } };
  $('#mdFs').onclick = fs; document.addEventListener('dblclick', fs);
  const hud = () => { dsp.classList.add('hud'); clearTimeout(hudT); hudT = setTimeout(() => dsp.classList.remove('hud'), 2800); }; document.addEventListener('mousemove', hud); document.addEventListener('touchstart', hud); hud();
  const idle = on => { $('#mdIdle').classList.toggle('hide', !on); V.classList.toggle('hide', on); };
  const pill = () => { const e = $('#mdPill'), m = S; if (!m || !m.on || (!m.who && !m.ag && !m.tot)) { e.classList.add('hide'); return; } const left = m.tot ? m.left - (Date.now() - SAt) : 0; e.classList.remove('hide'); e.innerHTML = (m.who ? '<span>📺 ' + esc(m.who) + '</span>' : '') + (m.tot ? '<span class="tm' + (left <= 30000 ? ' bad' : '') + '">⏱ ' + mtFmt(Math.max(0, left)) + '</span>' : '') + (m.ag ? '<span style="opacity:.85">📌 ' + esc(m.ag) + '</span>' : ''); };
  setInterval(pill, 1000);
  /* รายงานความละเอียด/เฟรมเรตที่รับจริงให้ Host ทุก 2 วินาที */
  setInterval(() => {
    let w = 0, h = 0, fps = 0; if (!V.classList.contains('hide') && V.videoWidth) { w = V.videoWidth; h = V.videoHeight; try { const q = V.getVideoPlaybackQuality(), n = performance.now(); if (fq.t) fps = Math.round((q.totalVideoFrames - fq.n) / ((n - fq.t) / 1000)); fq = { t: n, n: q.totalVideoFrames }; } catch (e) { } } else fq = { t: 0, n: 0 };
    const r = $('#mdRes'); r.classList.toggle('hide', !w); if (w) r.textContent = '📐 ' + w + '×' + h + (fps ? ' · ' + fps + ' fps' : ''); MClient.send({ t: 'd-stat', w, h, fps });
  }, 2000);
  const accept = call => { pend.delete(call.peer); try { call.answer(); } catch (e) { return false; }
    call.on('stream', st => { if (allowedP.has(call.peer)) show(st, call); }); call.on('close', () => { if (cur === call) { clearTimeout(curTm); curTm = setTimeout(() => { if (cur === call && !allowedP.size) { V.srcObject = null; idle(true); } }, 1500); } }); return true; };
  const show = (stream, call) => { clearTimeout(curTm); cur = call; if (V.srcObject !== stream) { V.srcObject = stream; V.play().catch(() => { }); } idle(false); };

      $('#mdSt').textContent = s === 'online' ? '● ' + T('เชื่อมต่อแล้ว · ', 'online · ') + code : (map[s] || s); $('#mdSt').className = 'chip ' + (s === 'online' ? 'ok' : s === 'error' || s === 'closed' ? 'bad' : 'warn'); $('#mdTx').textContent = map[s] || s;
      if (s === 'closed' || s === 'error') { V.srcObject = null; idle(true); }
    },
    state: s => { if (!s || typeof s !== 'object') return; S = s; SAt = Date.now(); if (s.mid && s.mid !== lastMid) { lastMid = s.mid; if (s.msg) { const b = $('#mdBan'); b.textContent = '📢 ' + String(s.msg).slice(0, 140); b.classList.remove('hide'); clearTimeout(banTm); banTm = setTimeout(() => b.classList.add('hide'), 12000); } } pill(); },
    onCall: call => {                                                       // รับสายจากผู้นำเสนอที่ Host อนุญาตเท่านั้น (ถ้ายังไม่รู้ว่าอนุญาต → พักไว้ 4 วิรอ d-expect)
      if (allowedP.has(call.peer)) return accept(call);
      const old = pend.get(call.peer); if (old && old !== call) { try { old.close(); } catch (e) { } } pend.set(call.peer, call);
      setTimeout(() => { if (pend.get(call.peer) === call) { pend.delete(call.peer); try { call.close(); } catch (e) { } } }, 4000); return true;
    },
    msg: m => { if (m.t === 'd-expect') { allowedP = new Set((Array.isArray(m.pids) ? m.pids : []).filter(x => typeof x === 'string').slice(0, 3)); pend.forEach((c, id) => { if (allowedP.has(id)) accept(c); }); if (!allowedP.size) { clearTimeout(curTm); cur = null; V.srcObject = null; idle(true); } } }
  });
}
const MR_joinBase = () => ((typeof DB !== 'undefined' && DB.settings && DB.settings.publicUrl) || (location.origin + location.pathname)).split('#')[0].split('?')[0];

/* ---------- ฝั่ง Studio หลัก ---------- */
const CoHost = {
  e: null,
  allow: new Set(['doc', 'pg', 'd', 'ls', 'lh', 'le', 'vw', 'lz', 'lz0', 'img']),
  src() { return (Live.state && Live.state.src) || 'A'; },
  label() { return this.e ? (this.e.s.label || this.e.s.name) : ''; },
  onJoin(s) {
    if (this.e && this.e.s !== s) { const o = this.e.s; this.drop(); Devices.kick(o); }     // รองรับเครื่องที่ 2 เพียง 1 เครื่อง (ตัวล่าสุดแทนตัวเดิม)
    const box = document.createElement('div'); box.className = 'cobox';
    const e = this.e = { s, ok: false, box, view: new CastView(box), imgs: new Map() };
    s.pending = true; toast('📱 ' + (s.label || s.name) + ' ' + T('ขอเชื่อมเป็นเครื่องนำเสนอที่ 2', 'wants to be the 2nd presenter'), 'ok', 3500); this.win(); Live.emit();
  },
  approve() { const e = this.e; if (!e) return; e.ok = true; e.s.pending = false; Live.send(e.s.id, { t: 'label', text: 'ok' }); Live.list('display').forEach(d => this.onDisplayJoin(d)); Live.emit(); },
  deny() { const e = this.e; if (!e) return; const s = e.s; this.drop(); Devices.kick(s); },
  drop() { const e = this.e; if (!e) return; this.e = null; try { Win.close('co'); } catch (x) { } try { e.view.destroy(); } catch (x) { } if (this.src() !== 'A' && Live.active) Live.setState({ src: 'A' }); Live.emit(); },
  remove(pid) { if (this.e && this.e.s.id === pid) { const l = this.label(); this.drop(); toast('📱 ' + l + ' ' + T('ตัดการเชื่อมต่อ', 'disconnected'), 'ok', 2200); } },
  clear() { const e = this.e; this.e = null; if (e) { try { e.view.destroy(); } catch (x) { } } },
  restore() { if (this.e) this.win(); },
  setSrc(v) {
    if (!['A', 'B', 'ab', 'ba'].includes(v)) return; if (v !== 'A' && !(this.e && this.e.ok)) return toast(T('ยังไม่มีเครื่องที่ 2 ที่ได้รับอนุญาต', 'No approved 2nd device'), 'err', 2200);
    Live.setState({ src: v });
  },
  sendImg(d, id) { const e = this.e; if (!e) return; if (!d.coImgs) d.coImgs = new Set(); if (d.coImgs.has(id)) return; const data = e.imgs.get(id); if (!data) return; d.coImgs.add(id); Live.send(d.id, { t: 'img', id, data, src: 'B' }); },
  onMsg(s, m) {
    const e = this.e; if (!e || e.s !== s) return;
    if (m.t === 'src') { if (e.ok) this.setSrc(m.v); return; }
    if (!e.ok || !this.allow.has(m.t)) return;
    try {
      if (m.t === 'img') {
        if (typeof m.id !== 'string' || !/^[\w-]{1,60}$/.test(m.id) || typeof m.data !== 'string' || m.data.length > 9e6 || !/^data:image\//.test(m.data)) return;
        e.imgs.set(m.id, m.data); Live.list('display').forEach(d => this.sendImg(d, m.id)); e.view.onMsg({ t: 'img', id: m.id, data: m.data }); return;
      }
      if (m.t === 'doc' && !(Array.isArray(m.pages) && m.pages.length <= 500)) return;
      if (m.t === 'pg' && !(Array.isArray(m.objs) && m.objs.length <= 20000)) return;
      e.view.onMsg(m);

  },
  /* จอฉายเพิ่งเข้าห้อง → ส่งสถานะปัจจุบันของเครื่องที่ 2 ให้ (ใช้โมเดลที่หน้าต่างเก็บไว้แล้ว ไม่ต้องขอซ้ำ) */
  onDisplayJoin(d) {
    const e = this.e; if (!e || !e.ok) return; const v = e.view; d.coImgs = new Set(); const out = m => Live.send(d.id, Object.assign(m, { src: 'B' }));
    for (const id of e.imgs.keys()) this.sendImg(d, id);
    if (v.pages.size) { out({ t: 'doc', pages: [...v.pages.values()] }); if (v.pid) out({ t: 'pg', pid: v.pid, objs: v.objs }); out({ t: 'vw', ar: v.ar, z: v.vw ? v.vw.z : null, cx: v.vw ? v.vw.cx : 0, cy: v.vw ? v.vw.cy : 0 }); }
  },
  win() {
    if (!this.e || !Win.layer) return; const H = this;
    return Win.open('co', {
      title: '📱 ' + T('เครื่องที่ 2', 'Device 2') + ' · ' + esc(this.label()), w: 460, h: 360,
      build(b, w) {
        b.innerHTML = `<div class="wm"><div class="cop"><b>${T('ขอเชื่อมเป็นเครื่องนำเสนอที่ 2', 'Wants to be the 2nd presenter')}</b><p class="small" style="margin:6px 0">${T('จะส่งสไลด์/ลายเส้นของเครื่องนั้นมาที่นี่ และขึ้นจอฉายได้', 'It can send its slides to this Studio and the projector.')}</p><div class="wm-bar"><button class="on" data-a="allow">✔ ${T('อนุญาต', 'Allow')}</button><button data-a="deny">✖ ${T('ปฏิเสธ', 'Deny')}</button></div></div>
          <div class="cobox-w"></div><div class="wm-bar cos"><button data-s="A">🖥 ${T('Studio หลัก', 'Main')}</button><button data-s="B">📱 ${T('เครื่องที่ 2', 'Device 2')}</button><button data-s="ab">◧ ${T('แบ่งจอ', 'Split')}</button><button data-s="ba">⇄</button></div></div>`;
        if (H.e) $('.cobox-w', b).appendChild(H.e.box);
        b.onclick = ev => { const a = ev.target.closest('[data-a]'), s = ev.target.closest('[data-s]'); if (a) { a.dataset.a === 'allow' ? H.approve() : H.deny(); } else if (s) H.setSrc(s.dataset.s); };
      },
      update(b) { const e = H.e; if (!e) return; $('.cop', b).classList.toggle('hide', e.ok); $('.cos', b).classList.toggle('hide', !e.ok); $$('[data-s]', b).forEach(x => x.classList.toggle('on', H.src() === x.dataset.s)); const tt = $('.win-t', b.closest('.win')); if (tt) tt.textContent = '📱 ' + T('เครื่องที่ 2', 'Device 2') + ' · ' + H.label(); }
    });
  }

/* =====================================================================
   Quiz Builder (10 ประเภท) + Run engine + Live page (ห้องสด)
   ===================================================================== */
const Q_TYPES = [
  ['mc', 'quiz', 'Multiple Choice', 'ตัวเลือก 4 ข้อหรือมากกว่า'], ['tf', 'check', 'True / False', 'ถูก หรือ ผิด'], ['open', 'edit', 'Open-ended', 'คำถามปลายเปิด'],
  ['cloud', 'globe', 'Word Cloud', 'รวบรวมความคิดเป็นกลุ่มคำ'], ['image', 'image', 'Image Question', 'โจทย์พร้อมรูปภาพ'], ['draw', 'pen', 'Draw / Annotate', 'ให้นักเรียนวาดคำตอบ'],
  ['match', 'link', 'Matching', 'จับคู่'], ['order', 'down', 'Ordering', 'เรียงลำดับ'], ['poll', 'chart', 'Poll / Rating', 'สำรวจความคิดเห็น/ให้คะแนน 1-5'], ['exit', 'hand', 'Exit Ticket', 'สรุปการเรียนรู้ท้ายคาบ']
];
const qType = k => Q_TYPES.find(t => t[0] === k) || Q_TYPES[0];
const isGraded = q => ['mc', 'tf', 'image', 'order', 'match'].includes(q.type);
function newQuestion(type) {
  const q = { id: uid('qq_'), type, text: '', points: isGraded({ type }) ? 10 : 0, time: ['mc', 'tf', 'image'].includes(type) ? 20 : 0, explain: '' };
  if (type === 'mc' || type === 'image') { q.options = ['', '', '', '']; q.correct = [0]; }
  if (type === 'tf') { q.correct = [0]; }
  if (type === 'order') { q.options = ['', '', '']; }
  if (type === 'match') { q.pairs = [['', ''], ['', ''], ['', '']]; }
  if (type === 'poll') { q.options = []; }
  if (type === 'exit') { q.text = 'Exit Ticket: สรุปสิ่งที่เรียนรู้วันนี้'; }
  return q;
}
function validateQ(q) {
  if (!q.text.trim()) return T('กรอกข้อความคำถาม', 'Enter question text');
  if (q.type === 'mc' || q.type === 'image') { const o = q.options.filter(x => x.trim()); if (o.length < 2) return T('ต้องมีตัวเลือกอย่างน้อย 2 ข้อ', 'At least 2 options'); if (q.options.some((x, i) => !x.trim() && q.correct.includes(i))) return T('ตัวเลือกที่เป็นเฉลยต้องไม่ว่าง', 'Correct option is empty'); if (!q.correct.length) return T('เลือกเฉลยอย่างน้อย 1 ข้อ', 'Pick a correct answer'); }
  if (q.type === 'image' && !q.img) return T('เพิ่มรูปภาพสำหรับโจทย์', 'Add an image');
  if (q.type === 'order' && q.options.filter(x => x.trim()).length < 2) return T('ต้องมีอย่างน้อย 2 รายการ', 'At least 2 items');
  if (q.type === 'match' && q.pairs.filter(p => p[0].trim() && p[1].trim()).length < 2) return T('ต้องมีอย่างน้อย 2 คู่', 'At least 2 pairs');
  return '';
}
function cleanQ(q) {
  const c = JSON.parse(JSON.stringify(q));
  if (c.type === 'mc' || c.type === 'image') { const keep = c.options.map((o, i) => [o.trim(), i]).filter(x => x[0]); c.correct = c.correct.map(ci => keep.findIndex(k => k[1] === ci)).filter(i => i >= 0); c.options = keep.map(k => k[0]); }
  if (c.type === 'order') c.options = c.options.map(x => x.trim()).filter(Boolean);
  if (c.type === 'match') c.pairs = c.pairs.filter(p => p[0].trim() && p[1].trim()).map(p => [p[0].trim(), p[1].trim()]);
  if (c.type === 'poll') c.options = (c.options || []).map(x => x.trim()).filter(Boolean);
  c.text = c.text.trim(); c.points = Math.max(0, Number(c.points) || 0); c.time = Math.max(0, Number(c.time) || 0);
  return c;
}

/* ---------- Run engine (ฝั่งครู) ---------- */
const Run = {
  pick: null, quiz: null, qs: [], idx: -1, status: 'idle', answers: {}, totals: {}, endsAt: 0, tick: null, opts: { speedBonus: false, anonymous: false, instant: false, attempts: 1 }, startedAt: 0, pub: null, saved: false, classId: null,
  listeners: new Set(), emit() { this.listeners.forEach(f => f()); }, sub(f) { this.listeners.add(f); return () => this.listeners.delete(f); },
  get q() { return this.qs[this.idx] || null; },
  async start(quiz, opts, classId) {
    this.quiz = quiz; this.opts = opts; this.classId = classId || null; this.answers = {}; this.totals = {}; this.idx = -1; this.status = 'ready'; this.startedAt = Date.now(); this.saved = false;
    this.qs = [];
    for (const q0 of quiz.questions) {
      const q = JSON.parse(JSON.stringify(q0));
      if (quiz.shuffle && (q.type === 'mc' || q.type === 'image') && q.options.length > 1) { const perm = shuffle(q.options.map((_, i) => i)); q.options = perm.map(i => q0.options[i]); q.correct = q0.correct.map(c => perm.indexOf(c)); }
      q.imgData = q.img ? (await IDB.get('imgs', q.img)) || null : null; this.qs.push(q);
    }
    Live.onAnswer = (s, m) => this.onAnswer(s, m);
    Live.setState({ status: 'ready', q: null, total: this.qs.length, title: quiz.title, final: null, reveal: null, quick: false }); this.emit();
  },
  publicQ(q, i) {
    const o = { id: q.id, type: q.type, text: q.text, idx: i, total: this.qs.length, points: q.points, time: q.time, img: q.imgData || null };
    if (q.type === 'mc' || q.type === 'image') { o.options = q.options; o.multi = q.correct.length > 1; }
    else if (q.type === 'tf') o.options = ['ถูก', 'ผิด'];
    else if (q.type === 'order') { let s = shuffle(q.options), n = 0; while (n++ < 5 && s.every((x, k) => x === q.options[k]) && s.length > 1) s = shuffle(q.options); o.options = s; }
    else if (q.type === 'match') { o.lefts = q.pairs.map(p => p[0]); o.rights = shuffle(q.pairs.map(p => p[1])); }
    else if (q.type === 'poll') o.options = q.options && q.options.length >= 2 ? q.options : null;
    return o;
  },
  openQ(i) {
    if (i < 0 || i >= this.qs.length) return; this.idx = i; const q = this.q; this.answers[q.id] = this.answers[q.id] || {}; this.status = 'open'; this.pub = this.publicQ(q, i);
    this.endsAt = q.time > 0 ? Date.now() + q.time * 1000 : 0; this.qStart = Date.now();
    Live.setState({ status: 'open', q: this.pub, idx: i, total: this.qs.length, remain: q.time > 0 ? q.time * 1000 : 0, reveal: null });
    clearInterval(this.tick); this.tick = setInterval(() => { if (this.endsAt && Date.now() >= this.endsAt) this.close(); else if (this.endsAt && this.tickCb) this.tickCb(); }, 500); this.emit();
  },
  close() { if (this.status !== 'open') return; clearInterval(this.tick); this.status = 'closed'; this.endsAt = 0; Live.setState({ status: 'closed', remain: 0 }); this.emit(); },
  reveal() {
    if (!this.q) return; if (this.status === 'open') this.close(); const q = this.q; this.status = 'reveal';
    const rv = { explain: q.explain || '' }; if (q.type === 'mc' || q.type === 'image' || q.type === 'tf') rv.correct = q.correct; else if (q.type === 'order') rv.order = q.options; else if (q.type === 'match') rv.pairs = q.pairs;
    Live.setState({ status: 'reveal', reveal: rv });
    Live.list().forEach(s => { const a = (this.answers[q.id] || {})[s.name]; Live.send(s.id, { t: 'result', qid: q.id, answered: !!a, correct: a ? a.correct : null, pts: a ? a.pts : 0, total: this.totals[s.name] || 0 }); });
    this.emit();
  },
  grade(q, ans, ms) {
    let correct = null, frac = 0;
    if (q.type === 'mc' || q.type === 'image' || q.type === 'tf') { const a = Array.isArray(ans) ? ans.map(Number).filter(Number.isInteger).sort() : []; const c = q.correct.slice().sort(); correct = a.length === c.length && a.every((v, i) => v === c[i]); frac = correct ? 1 : 0; }
    else if (q.type === 'order') { const a = Array.isArray(ans) ? ans.map(String) : []; correct = a.length === q.options.length && a.every((v, i) => v === q.options[i]); frac = correct ? 1 : 0; }
    else if (q.type === 'match') { const a = Array.isArray(ans) ? ans : []; let ok = 0; q.pairs.forEach((p, i) => { if (a[i] === p[1]) ok++; }); correct = ok === q.pairs.length; frac = ok / q.pairs.length; }
    let pts = 0;
    if (isGraded(q)) { pts = Math.round(q.points * frac); if (this.opts.speedBonus && frac === 1 && q.time > 0) { const left = Math.max(0, 1 - ms / (q.time * 1000)); pts += Math.round(q.points * .5 * left); } }
    else pts = q.points || 0;
    return { correct, pts };
  },
  onAnswer(s, m) {
    const q = this.q; if (!q || m.qid !== q.id || this.status !== 'open') { Live.send(s.id, { t: 'result', qid: m.qid, late: true }); return; }
    const A = this.answers[q.id]; const prev = A[s.name]; const attempts = (prev ? prev.attempts : 0) + 1;
    if (attempts > this.opts.attempts) { Live.send(s.id, { t: 'result', qid: q.id, limit: true }); return; }
    let ans = m.ans; if (typeof ans === 'string' && ans.length > 250000) return; if (Array.isArray(ans) && ans.length > 40) return;
    if (['open', 'cloud'].includes(q.type)) ans = String(ans || '').slice(0, 300);
    if (q.type === 'exit') { ans = { learned: String(ans && ans.learned || '').slice(0, 400), doubt: String(ans && ans.doubt || '').slice(0, 400), conf: clamp(+(ans && ans.conf) || 0, 0, 5) }; }
    const ms = Date.now() - this.qStart; const g = this.grade(q, ans, ms);
    A[s.name] = { ans, ms, correct: g.correct, pts: g.pts, attempts, ts: Date.now() }; this.recompute();
    if (this.opts.instant) Live.send(s.id, { t: 'result', qid: q.id, answered: true, correct: g.correct, pts: g.pts, total: this.totals[s.name] || 0, instant: true });
    this.emit(); Live.emit();
  },
  recompute() { const t = {}; for (const qid in this.answers) for (const n in this.answers[qid]) t[n] = (t[n] || 0) + (this.answers[qid][n].pts || 0); this.totals = t; },
  board() { return Object.entries(this.totals).sort((a, b) => b[1] - a[1]).map(([name, pts], i) => ({ name, pts, rank: i + 1 })); },
  end() {
    clearInterval(this.tick); this.status = 'ended'; const b = this.board(); Live.setState({ status: 'ended', final: b.slice(0, 10), q: null });
    Live.list().forEach(s => { const r = b.find(x => x.name === s.name); Live.send(s.id, { t: 'result', final: true, rank: r ? r.rank : null, total: r ? r.pts : 0, of: b.length }); });
    if (!this.saved) {
      this.saved = true; const res = {}; Object.keys(this.totals).forEach(n => res[n] = { pts: this.totals[n], answers: {} });
      for (const qid in this.answers) for (const n in this.answers[qid]) { const a = this.answers[qid][n]; (res[n] = res[n] || { pts: 0, answers: {} }).answers[qid] = { ans: typeof a.ans === 'string' && a.ans.startsWith('data:') ? '[ภาพ]' : a.ans, correct: a.correct, pts: a.pts, ms: a.ms }; }
      DB.sessions.unshift({ id: uid('ss_'), quizId: this.quiz.id, title: this.quiz.title, date: Date.now(), classId: this.classId, questions: this.qs.map(q => ({ id: q.id, text: q.text, type: q.type, points: q.points })), results: res });
      DB.sessions = DB.sessions.slice(0, 120); save();
      Object.keys(this.totals).forEach(n => { DB.points[n] = (DB.points[n] || 0) + this.totals[n]; }); save();
    }
    if (typeof logEvent === 'function') logEvent('quiz', 'finish ' + this.quiz.title); try { Teach.tool('quiz', 'แบบทดสอบ: ' + this.quiz.title); } catch (e) { }
    this.emit();
  },
  reset() { clearInterval(this.tick); this.status = 'idle'; this.quiz = null; this.qs = []; this.idx = -1; Live.onAnswer = null; if (Live.active) Live.setState({ status: 'idle', q: null, reveal: null, final: null }); this.emit(); },
  stats(q) {
    const A = this.answers[q.id] || {}; const names = Object.keys(A); const out = { n: names.length };
    if (q.type === 'mc' || q.type === 'image') { out.counts = q.options.map(() => 0); names.forEach(n => (A[n].ans || []).forEach(i => { if (out.counts[i] !== undefined) out.counts[i]++; })); }
    else if (q.type === 'tf') { out.counts = [0, 0]; names.forEach(n => (A[n].ans || []).forEach(i => { if (out.counts[i] !== undefined) out.counts[i]++; })); }
    else if (q.type === 'poll') { const k = q.options && q.options.length >= 2 ? q.options.length : 5; out.counts = Array(k).fill(0); out.rating = !(q.options && q.options.length >= 2); names.forEach(n => { const v = Array.isArray(A[n].ans) ? A[n].ans[0] : A[n].ans; const i = out.rating ? Number(v) - 1 : Number(v); if (out.counts[i] !== undefined) out.counts[i]++; }); }
    else if (q.type === 'cloud') { const m = {}; names.forEach(n => { String(A[n].ans || '').split(/[\n,]+/).map(w => w.trim()).filter(Boolean).forEach(w => { const k = w.toLowerCase(); m[k] = m[k] || { w, c: 0 }; m[k].c++; }); }); out.words = Object.values(m).sort((a, b) => b.c - a.c); }
    else if (q.type === 'order' || q.type === 'match') { out.right = names.filter(n => A[n].correct).length; }
    return out;
  },
  csv() {
    const rows = [['ชื่อ', 'คะแนนรวม', ...this.qs.map((q, i) => `ข้อ ${i + 1}: ${q.text}`)]];
    const names = new Set([...Object.keys(this.totals), ...Live.list().map(s => s.name)]);
    [...names].sort((a, b) => (this.totals[b] || 0) - (this.totals[a] || 0)).forEach(n => rows.push([n, this.totals[n] || 0, ...this.qs.map(q => { const a = (this.answers[q.id] || {})[n]; if (!a) return ''; const v = typeof a.ans === 'string' && a.ans.startsWith('data:') ? '[ภาพ]' : (typeof a.ans === 'object' ? JSON.stringify(a.ans) : String(a.ans)); return (isGraded(q) ? (a.correct ? '✓ ' : '✗ ') : '') + v + ' (' + a.pts + ')'; })]));
    return toCSV(rows);
  }
};

    function scoreHtml() { const board = Run.board().slice(0, 8), st = Run.status; return `<h3>${ic('trophy', 18)} ${T('อันดับคะแนน', 'Scoreboard')}</h3>` + (board.length ? board.map(b => `<div class="score-row"><div class="rk">${b.rank}</div><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${Run.opts.anonymous && st !== 'ended' ? '•••' : esc(b.name)}</div><div class="sc">${b.pts}</div></div>`).join('') : `<div class="muted small">${T('ยังไม่มีคะแนน', 'No scores yet')}</div>`); }
    function updateDyn() {
      const q = Run.q; if (!q) return; const n = Live.list().length, stats = Run.stats(q);
      const c = $('#rCnt', runCard); if (c) c.innerHTML = `· ${T('ตอบแล้ว', 'answered')} <b>${stats.n}</b> / ${n}`; const bar = $('#rBar', runCard); if (bar) bar.style.width = (n ? Math.min(100, Math.round(stats.n / n * 100)) : 0) + '%';
      const r = $('#rRes', runCard); if (r) r.innerHTML = resultView(q, stats, Run.status); const sc = $('#rScore', runCard); if (sc) sc.innerHTML = scoreHtml();
    }
    function endView() { const b = Run.board(); return `<h2 style="margin-top:14px">🏆 ${T('สรุปผล', 'Final results')}</h2>${b.length ? `<div class="tw"><table class="t"><thead><tr><th>#</th><th>${T('ชื่อ', 'Name')}</th><th>${T('คะแนน', 'Score')}</th></tr></thead><tbody>${b.map(x => `<tr><td>${x.rank}</td><td>${esc(x.name)}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div>` : `<div class="muted">${T('ไม่มีผู้ตอบ', 'No responses')}</div>`}<p class="small muted">${T('บันทึกผลลงรายงาน (วิเคราะห์ผล) แล้ว และสะสม XP ให้นักเรียนในหน้า เกม/คะแนน', 'Saved to Analytics; XP added.')}</p>`; }
    function resultView(q, s, st) {
      const anon = Run.opts.anonymous; const A = Run.answers[q.id] || {};
      if (['mc', 'image', 'tf', 'poll'].includes(q.type)) {
        const labels = q.type === 'tf' ? ['ถูก', 'ผิด'] : q.type === 'poll' && s.rating ? ['★1', '★2', '★3', '★4', '★5'] : q.options; const tot = Math.max(1, s.counts.reduce((a, b) => a + b, 0));
        const rv = st === 'reveal' || st === 'closed'; const okSet = new Set(isGraded(q) ? q.correct : []);
        const avg = s.rating ? (s.counts.reduce((a, c, i) => a + c * (i + 1), 0) / tot).toFixed(2) : null;
        return labels.map((l, i) => `<div class="pb"><div class="lab">${esc(l)}${st === 'reveal' && okSet.has(i) ? ' ✓' : ''}</div><div class="bar"><i class="${st === 'reveal' && okSet.has(i) ? 'ok' : ''}" style="width:${Math.round(s.counts[i] / tot * 100)}%"></i></div><div class="n">${s.counts[i]}</div></div>`).join('') + (avg ? `<div class="small muted">${T('ค่าเฉลี่ย', 'Average')} ${avg}</div>` : '') + (st === 'reveal' && q.explain ? `<div class="card flat" style="margin-top:8px"><b>${T('คำอธิบาย', 'Explanation')}:</b> ${esc(q.explain)}</div>` : '');
      }
      if (q.type === 'cloud') { const mx = s.words.length ? s.words[0].c : 1; return `<div class="wc">${s.words.length ? s.words.slice(0, 60).map(w => `<span style="font-size:${14 + w.c / mx * 34}px;opacity:${.55 + w.c / mx * .45}">${esc(w.w)}</span>`).join('') : `<span class="muted small">${T('รอคำตอบ…', 'Waiting…')}</span>`}</div>`; }
      if (q.type === 'open') return `<div style="display:grid;gap:8px;max-height:300px;overflow:auto">${Object.keys(A).map(n => `<div class="card flat" style="padding:8px 12px"><b class="small">${anon ? '•••' : esc(n)}</b><div>${esc(A[n].ans)}</div></div>`).join('') || `<span class="muted small">${T('รอคำตอบ…', '')}</span>`}</div>`;
      if (q.type === 'exit') return `<div style="display:grid;gap:8px;max-height:320px;overflow:auto">${Object.keys(A).map(n => `<div class="card flat" style="padding:8px 12px"><b class="small">${anon ? '•••' : esc(n)}</b> <span class="chip">${'★'.repeat(A[n].ans.conf || 0)}</span><div class="small">✔ ${esc(A[n].ans.learned)}</div><div class="small">？ ${esc(A[n].ans.doubt)}</div></div>`).join('') || `<span class="muted small">${T('รอคำตอบ…', '')}</span>`}</div>`;
      if (q.type === 'draw') return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:340px;overflow:auto">${Object.keys(A).map(n => `<div><img src="${A[n].ans}" style="width:100%;border:1px solid var(--line);border-radius:10px;cursor:zoom-in" data-zoom><div class="tiny">${anon ? '•••' : esc(n)}</div></div>`).join('') || `<span class="muted small">${T('รอคำตอบ…', '')}</span>`}</div>`;
      if (q.type === 'order' || q.type === 'match') return `<div class="stat"><div class="ico">${ic('check')}</div><div><b>${s.right} / ${s.n}</b><span class="small muted">${T('ตอบถูกทั้งหมด', 'fully correct')}</span></div></div>` + (st === 'reveal' ? `<div class="card flat" style="margin-top:8px"><b>${T('เฉลย', 'Answer')}:</b><br>${q.type === 'order' ? q.options.map((o, i) => `${i + 1}. ${esc(o)}`).join('<br>') : q.pairs.map(p => `${esc(p[0])} ↔ ${esc(p[1])}`).join('<br>')}</div>` : '');
      return '';
    }
    Run.tickCb = () => { const t = $('#rTimer', runCard); if (t) t.textContent = '⏱ ' + Math.max(0, Math.ceil((Run.endsAt - Date.now()) / 1000)) + 's'; };
    const order = () => { const running = Run.status !== 'idle' && Live.active; if (running && el.firstChild !== runCard) el.insertBefore(runCard, el.firstChild); else if (!running && el.firstChild === runCard) el.appendChild(runCard); };
    const un = [Run.sub(() => { order(); drawRun(); }), Live.sub(drawRun)];
    runCard.addEventListener('click', e => { const z = e.target.closest('[data-zoom]'); if (z) modal({ title: '', body: `<img src="${z.src}" style="width:100%">`, wide: true }); });
    order(); drawRun();
    return () => { unR && unR(); un.forEach(f => f()); Run.tickCb = null; };
  }
};

  return { v, set(stream, show) { const w = !!(show && stream); if (w && v.srcObject !== stream) { v.srcObject = stream; v.play().catch(() => { }); } if (!w && v.srcObject) v.srcObject = null; if (w !== on) { on = w; last = ''; v.classList.toggle('hide', !w); view.setOverlay(w); } if (w) view.need = true; } };

/* =====================================================================
   RI — ตัวอ่านรายชื่อนักเรียนอัจฉริยะ (ทำงานในเครื่อง ไม่ส่งข้อมูลออกนอกเครื่อง · ไม่ใช้ AI ภายนอก)
   วางหรืออัปโหลดรายชื่อทั้งห้องครั้งเดียว → ระบบเดาให้เอง: ชื่อห้อง/ระดับชั้น/ปีการศึกษา/ภาคเรียน/วิชา (จากบรรทัดหัวเรื่อง ชื่อไฟล์ ชื่อแผ่นงาน หรือคอลัมน์ห้อง)
   · คอลัมน์ (เลขที่ รหัส คำนำหน้า ชื่อ นามสกุล ชื่อเล่น เพศ) จากหัวตารางหรือเดาจากข้อมูล · แยกคำนำหน้า + เพศ · ใส่เลขที่ให้ · ตัดชื่อซ้ำ
   · ข้ามบรรทัดที่ไม่ใช่รายชื่อ (รวม/ลายเซ็น/หัวกระดาษ) · แยกหลายห้องในชุดเดียว (หลายแผ่นงาน/หลายบล็อก/คอลัมน์ห้อง)
   ===================================================================== */
/* =====================================================================
   RosterAI — ตัวอ่านรายชื่อนักเรียนอัจฉริยะ (กฎ + เฮอริสติกทั้งหมด ทำงานในเครื่อง ไม่ส่งข้อมูลนักเรียนออกไปไหน)
   รับ: ข้อความที่วาง (Excel/Sheets/Word/LINE/CSV) หรือแผ่นงานจากไฟล์ → คืน: ห้องที่ตรวจพบ + นักเรียนที่จัดระเบียบแล้ว + ข้อเท็จจริงที่ระบบทำให้
   ทำเอง: จับชื่อห้อง/ระดับชั้น/ปีการศึกษา/ภาคเรียน/วิชา · เดาคอลัมน์ · แยกคำนำหน้า(+เพศ) · ใส่เลขที่ · ตัดชื่อซ้ำ · ข้ามบรรทัดที่ไม่ใช่รายชื่อ
   ===================================================================== */
const RI = (() => {
  const TH_DIG = '๐๑๒๓๔๕๖๗๘๙';
  const PF = '(เด็กชาย|เด็กหญิง|นางสาว|ด\\.\\s?ช\\.?|ด\\.\\s?ญ\\.?|น\\.\\s?ส\\.?|ดช\\.?|ดญ\\.?|นส\\.?|นาย|นาง|master|mrs\\.?|miss|mr\\.?|ms\\.?)';
  const PFX_WHOLE = new RegExp('^' + PF + '$', 'i'), PFX_START = new RegExp('^' + PF + '\\s*', 'i');
  const genderOfPfx = p => { p = String(p || '').replace(/[\s.]/g, '').toLowerCase(); return /^(เด็กชาย|ดช|นาย|master|mr)$/.test(p) ? 'm' : /^(เด็กหญิง|ดญ|นางสาว|นส|นาง|miss|mrs|ms)$/.test(p) ? 'f' : ''; };
  const genderOfCell = v => { v = String(v || '').trim().toLowerCase(); return /^(ชาย|ช|m|male|boy)$/.test(v) ? 'm' : /^(หญิง|ญ|f|female|girl)$/.test(v) ? 'f' : ''; };
  /* แยกคำนำหน้าออกจากชื่อ (ติดชื่อก็ได้: เด็กชายสมชาย) — ชื่อที่มีแต่คำนำหน้า/คำเดียวที่กำกวมจะไม่ตัด */
  const splitPrefix = s => {
    s = String(s || '').trim(); const m = PFX_START.exec(s); if (!m) return { prefix: '', rest: s };
    const raw = m[1], rest = s.slice(m[0].length).trim(); if (!rest) return { prefix: '', rest: s };
    const attached = m[0].length === m[1].length, strong = /\./.test(raw) || /^(เด็กชาย|เด็กหญิง|นางสาว)$/.test(raw);
    if (attached && !strong && !/\s/.test(rest)) return { prefix: '', rest: s };
    return { prefix: raw.replace(/\s+/g, ''), rest };
  };

  /* ---------- ห้อง / ระดับชั้น ---------- */
  const TAIL = '\\s*(\\d{1,2})(?:\\s*(?:/|-|–|ห้องที่|ห้อง)\\s*(\\d{1,2}))?(?!\\d)';
  const CLS_LONG = new RegExp('((มัธยมศึกษาปีที่|มัธยมศึกษา|ประถมศึกษาปีที่|ประถมศึกษา|อนุบาลปีที่|อนุบาล)' + TAIL + ')', 'i');           // คำเต็ม: ติดกับคำอื่นได้ (ชั้นมัธยมศึกษาปีที่ 1/2)
  const CLS_SHORT = new RegExp('(?:^|[^A-Za-zก-๙])((ปวช\\.?|ปวส\\.?|ม\\.?|ป\\.?|อ\\.?|Grade|Class|M|P|G)' + TAIL + ')', 'i');      // คำย่อ: ต้องไม่ติดกับตัวอักษรอื่น
  const lvKey = lv => { const t = String(lv).replace(/\./g, '').toLowerCase(); if (/^(มัธยมศึกษา(ปีที่)?|ม|m)$/.test(t)) return 'ม.'; if (/^(ประถมศึกษา(ปีที่)?|ป|p)$/.test(t)) return 'ป.'; if (/^(อนุบาล(ปีที่)?|อ)$/.test(t)) return 'อ.'; if (t === 'ปวช') return 'ปวช.'; if (t === 'ปวส') return 'ปวส.'; return 'Grade '; };
  const LEVEL_FULL = { 'ม.': 'มัธยมศึกษาปีที่ ', 'ป.': 'ประถมศึกษาปีที่ ', 'อ.': 'อนุบาลปีที่ ', 'ปวช.': 'ปวช. ปีที่ ', 'ปวส.': 'ปวส. ปีที่ ', 'Grade ': 'Grade ' };
  const levelMax = { 'ม.': 6, 'ป.': 6, 'อ.': 3, 'ปวช.': 3, 'ปวส.': 2, 'Grade ': 12 };
  /* ข้อความ → { name:'ม.1/2', level:'มัธยมศึกษาปีที่ 1', m } หรือ null */
  const findClass = text => {
    const t = String(text || ''); const m = CLS_LONG.exec(t) || CLS_SHORT.exec(t); if (!m) return null; const k = lvKey(m[2]), n = +m[3]; if (!(n >= 1 && n <= (levelMax[k] || 12))) return null;
    const r = m[4] ? +m[4] : null; return { name: k + n + (r ? '/' + r : ''), level: LEVEL_FULL[k] + n, text: m[1], len: m[1].length };
  };
  const isClassCell = v => { const c = findClass(v); return !!c && String(v).trim().length - c.len <= 3; };

  /* ---------- หัวตาราง ---------- */
  const HDR = [
    ['no', /^(เลขที่|ลำดับ|ลำดับที่|ที่|no|number|#|seq)$/i],
    ['code', /^(รหัส|รหัสนักเรียน|รหัสประจำตัว|รหัสประจำตัวนักเรียน|เลขประจำตัว|เลขประจำตัวนักเรียน|เลขประจำตัวประชาชน|student ?id|studentid|id|code)$/i],
    ['prefix', /^(คำนำหน้า|คำนำหน้าชื่อ|นำหน้า|prefix|title)$/i],
    ['full', /^(ชื่อ ?-? ?(นามสกุล|สกุล)|ชื่อและนามสกุล|ชื่อและสกุล|ชื่อนักเรียน|ชื่อ-นามสกุลนักเรียน|name|full ?name|student ?name|student)$/i],
    ['first', /^(ชื่อ|ชื่อต้น|ชื่อจริง|first ?name|given ?name|firstname)$/i],
    ['last', /^(นามสกุล|สกุล|last ?name|surname|family ?name|lastname)$/i],
    ['nick', /^(ชื่อเล่น|เล่น|nick|nickname)$/i],
    ['gender', /^(เพศ|gender|sex)$/i],
    ['class', /^(ชั้น ?\/ ?ห้อง|ชั้นเรียน|ชั้น ?- ?ห้อง|ห้องเรียน|ห้อง|class|classroom|room|ชั้น|grade)$/i]
  ];
  const hdrOf = c => { c = String(c || '').trim().replace(/[:：]$/, '').trim(); if (!c || c.length > 30) return ''; const c2 = c.replace(/\s+/g, ''); for (const [k, re] of HDR) if (re.test(c) || re.test(c2)) return k; return ''; };
  const mapHeader = r => {
    const map = {}; let hits = 0; r.forEach((c, i) => { const k = hdrOf(c); if (k && map[k] == null) { map[k] = i; hits++; } });
    if (map.first != null && map.last == null && map.full == null) { map.full = map.first; delete map.first; }          // “ชื่อ” คอลัมน์เดียว = ชื่อเต็ม
    if (map.full != null) { delete map.first; delete map.last; }
    return { map, hits };
  };

  /* ---------- บรรทัดที่ไม่ใช่รายชื่อ ---------- */
  const IGN = /^(รวม|รวมทั้งหมด|รวมทั้งสิ้น|total|ชาย\s*\d|หญิง\s*\d|จำนวน|ลงชื่อ|ครูที่ปรึกษา|ครูประจำชั้น|ครูผู้สอน|หมายเหตุ|วันที่|หน้า\s*\d|page\s*\d|พิมพ์เมื่อ|โรงเรียน|สำนักงาน|เอกสาร|ที่\s+ชื่อ)/i;
  const TITLE_KW = /(รายชื่อ|ชั้น|ปีการศึกษา|ภาคเรียน|รายวิชา|วิชา|โรงเรียน|ครูที่ปรึกษา|ห้องเรียน|ห้องที่|class|grade|roster|school|semester|term)/i;
  const metaFrom = (text, meta) => {
    let m;
    if ((m = /ปีการศึกษา\s*:?\s*(25\d{2}|20\d{2})/.exec(text)) || (m = /\bปี\s*(25\d{2})\b/.exec(text))) meta.year = m[1];
    if ((m = /ภาคเรียน(?:ที่)?\s*:?\s*([12])(?!\d)/.exec(text)) || (m = /(?:เทอม|term|semester)\s*:?\s*([12])(?!\d)/i.exec(text)) || (m = /(?:^|[^\d/])([12])\s*\/\s*25\d{2}/.exec(text))) meta.term = m[1];
    if (!meta.year && (m = /(?:^|[^\d/])[12]\s*\/\s*(25\d{2})/.exec(text))) meta.year = m[1];
    if ((m = /(?:รายวิชา|วิชา)\s*:?\s*(\S.*?)(?=\s{2,}|\s+(?:ภาคเรียน|ปีการศึกษา|ชั้น|ห้อง|ครู|ม\.|ป\.|อ\.)|$)/.exec(text))) meta.subject = m[1].trim().slice(0, 60);
  };

  /* ---------- ข้อความ → แถว ---------- */
  const normText = s => String(s || '').replace(/[​-‍﻿]/g, '').replace(/ /g, ' ').replace(/[๐-๙]/g, d => TH_DIG.indexOf(d)).replace(/\r\n?/g, '\n');
  const textToRows = (text, parseCSV) => {
    const lines = normText(text).split('\n'), ne = lines.filter(l => l.trim()); if (!ne.length) return { rows: [], delim: '' };
    const frac = re => ne.filter(l => re.test(l)).length / ne.length;
    let delim = '', rows;
    if (ne.some(l => l.includes('\t'))) { delim = 'tab'; rows = lines.map(l => l.split('\t').map(x => x.trim())); }
    else if (frac(/,/) >= .5 && parseCSV) { delim = 'comma'; rows = parseCSV(lines.join('\n')).map(r => r.map(x => String(x ?? '').trim())); }
    else if (frac(/[;|]/) >= .5) { delim = 'semicolon'; rows = lines.map(l => l.split(/[;|]/).map(x => x.trim())); }
    else if (frac(/\S\s{2,}\S/) >= .5) { delim = 'spaces'; rows = lines.map(l => l.trim().split(/\s{2,}/).map(x => x.trim())); }
    else { delim = 'lines'; rows = lines.map(l => [l.trim()]); }
    return { rows: rows.filter(r => r.some(Boolean)).slice(0, 3000), delim };
  };

  /* ---------- เดาคอลัมน์เมื่อไม่มีหัวตาราง ---------- */
  const inferCols = rows => {
    const W = Math.max(0, ...rows.map(r => r.length)), st = [];
    for (let c = 0; c < W; c++) {
      const vals = rows.map(r => String(r[c] ?? '').trim()).filter(Boolean), n = vals.length; const s = { c, n, no: 0, code: 0, pfx: 0, cls: 0, gen: 0, text: 0, spaced: 0, len: 0 };
      vals.forEach(v => { if (/^\d{1,3}$/.test(v)) s.no++; else if (/^[A-Za-z]{0,2}\d{4,14}$/.test(v)) s.code++; else if (PFX_WHOLE.test(v)) s.pfx++; else if (isClassCell(v)) s.cls++; else if (genderOfCell(v) && v.length <= 6) s.gen++; else if (/[A-Za-zก-๙]/.test(v)) { s.text++; if (/\s/.test(v)) s.spaced++; s.len += v.length; } });
      st.push(s);
    }
    const need = Math.max(2, Math.round(rows.length * .4)), ok = (s, k, r) => s.n >= need && s[k] / s.n >= r;
    const map = {}; const set = (k, s) => { if (map[k] == null) map[k] = s.c; };
    st.forEach(s => { if (ok(s, 'no', .8)) set('no', s); });
    st.forEach(s => { if (ok(s, 'code', .7)) set('code', s); });
    st.forEach(s => { if (ok(s, 'pfx', .6)) set('prefix', s); });
    st.forEach(s => { if (ok(s, 'cls', .6)) set('class', s); });
    st.forEach(s => { if (ok(s, 'gen', .6)) set('gender', s); });
    const T = st.filter(s => s.n >= need && s.text / s.n >= .6 && !Object.values(map).includes(s.c));
    const spaced = s => s.spaced / s.n >= .5, short = s => s.len / s.text <= 12 && s.spaced / s.n < .3;
    if (T.length === 1) map.full = T[0].c;
    else if (T.length >= 2) {
      if (map.prefix != null || !spaced(T[0])) { map.first = T[0].c; map.last = T[1].c; if (T[2] && short(T[2])) map.nick = T[2].c; }
      else { map.full = T[0].c; if (short(T[1])) map.nick = T[1].c; }
    }
    return map;
  };

  /* ---------- บรรทัดเดียว → นักเรียน ("1. นายสมชาย ใจดี 12345 (ชาย)") ---------- */
  const parseLine = s => {
    s = String(s || '').trim().replace(/^[•·*\-–]\s+/, ''); let no = null, code = '', nick = '', m;
    if ((m = /^(\d{1,3})\s*[.)\]:\-–]\s*(.+)$/.exec(s)) || (m = /^(\d{1,3})\s+(.+)$/.exec(s))) { no = +m[1]; s = m[2].trim(); }
    if ((m = /^([A-Za-z]{0,2}\d{4,14})\s+(.+)$/.exec(s))) { code = m[1]; s = m[2].trim(); }
    else if ((m = /^(.*\S)\s+([A-Za-z]{0,2}\d{4,14})$/.exec(s))) { code = m[2]; s = m[1].trim(); }
    if ((m = /^(.*\S)\s*[(（]([^()（）]{1,20})[)）]\s*$/.exec(s))) { nick = m[2].trim(); s = m[1].trim(); }
    return { no, code, nick, full: s };
  };

  /* ---------- ตัวอ่านหลัก ---------- */
  const guessFromName = name => { const t = String(name || '').replace(/\.[^.]+$/, ''); const c = findClass(t); return c ? c.name : ''; };
  const parse = (input, opt = {}) => {
    const clean = opt.cleanName || (s => String(s || '').replace(/\s+/g, ' ').trim()), norm = opt.normName || (s => String(s || '').replace(/\s+/g, ' ').trim().toLowerCase());
    const sheets = input.sheets ? input.sheets.map(s => ({ name: s.name || '', rows: s.rows.slice(0, 3000).map(r => r.slice(0, 40).map(x => normText(String(x ?? '')).trim())).filter(r => r.some(Boolean)) })) : (() => { const t = textToRows(input.text, opt.parseCSV); return [{ name: '', rows: t.rows, delim: t.delim }]; })();
    const facts = { delim: (sheets[0] && sheets[0].delim) || (input.sheets ? 'file' : ''), cols: [], header: false, lines: false, classSrc: '', meta: {}, ignored: [], prefixStripped: 0, sheets: sheets.length, rows: 0 };
    const groups = new Map(); const grp = (name, level) => { const k = name || ''; if (!groups.has(k)) groups.set(k, { name: k, level: level || '', students: [], dups: [], src: '' }); const g = groups.get(k); if (level && !g.level) g.level = level; return g; };
    const fileCls = guessFromName(input.fileName);
    const multiSheet = sheets.length > 1;
    sheets.forEach(sh => {

/* เข้ากันได้กับโค้ดเดิม: ข้อความ → รายชื่อแบน (ทุกห้องที่อ่านได้) · startNo = เลขที่เริ่มต้นเมื่อในข้อมูลไม่มีเลขที่ */
function parseRoster(text, startNo = 1) {

  return out;
}

/* ---------- Smart Group Maker ---------- */
const GROUP_COLORS = ['#4a76b8', '#e98fa6', '#1f9d6b', '#e8590c', '#7048e8', '#f0b429', '#1c7ed6', '#d6336c'];
const DUTIES = ['หัวหน้ากลุ่ม', 'เลขานุการ', 'ผู้นำเสนอ', 'ผู้จับเวลา', 'ผู้รวบรวมอุปกรณ์'];
function makeGroups(students, o) {
  const n = students.length; if (!n) return [];
  let k = o.mode === 'size' ? Math.ceil(n / Math.max(1, o.size)) : Math.max(1, Math.min(o.k, n)); const G = Array.from({ length: k }, (_, i) => ({ name: `กลุ่ม ${i + 1}`, color: GROUP_COLORS[i % GROUP_COLORS.length], members: [], roles: {} }));
  const byId = new Map(students.map(s => [s.id, s])); const par = {}; const find = x => par[x] === x ? x : (par[x] = find(par[x])); students.forEach(s => par[s.id] = s.id);
  (o.keep || []).forEach(([a, b]) => { if (par[a] !== undefined && par[b] !== undefined) par[find(a)] = find(b); });
  const units = {}; students.forEach(s => { (units[find(s.id)] = units[find(s.id)] || []).push(s); });
  let U = Object.values(units); const score = u => u.reduce((a, s) => a + (DB.points[s.name] || 0), 0);
  const sepOf = new Map(); (o.sep || []).forEach(([a, b]) => { (sepOf.get(a) || sepOf.set(a, new Set()).get(a)).add(b); (sepOf.get(b) || sepOf.set(b, new Set()).get(b)).add(a); });
  const conflict = (g, u) => u.some(s => g.members.some(m => sepOf.get(s.id) && sepOf.get(s.id).has(m.id)));
  const fixed = o.fixed || {}; const rest = [];
  U.forEach(u => { const fx = u.find(s => fixed[s.id] !== undefined); if (fx && G[fixed[fx.id]]) G[fixed[fx.id]].members.push(...u); else rest.push(u); });
  if (o.mode === 'balanced') rest.sort((a, b) => score(b) - score(a) || b.length - a.length); else { rest.sort(() => Math.random() - .5); rest.sort((a, b) => b.length - a.length); }
  const cap = o.mode === 'size' ? Math.max(1, o.size) : Math.ceil(n / k); let warn = false;
  rest.forEach(u => {
    const gs = (g) => g.members.reduce((a, s) => a + (DB.points[s.name] || 0), 0);
    let cand = G.filter(g => g.members.length + u.length <= cap + (o.mode === 'size' ? 0 : 1) && !conflict(g, u)); if (!cand.length) cand = G.filter(g => !conflict(g, u));

};

/* ---------- AI Teaching Assistant (โมดูลเสียบ AI ภายหลัง) ---------- */
const AIProviders = {
  local: {
    name: 'ร่างอัตโนมัติในเครื่อง (ไม่ใช้ AI ภายนอก)',
    async generate(text, kind, n) {
      const seg = (s) => { try { const sg = new Intl.Segmenter('th', { granularity: 'word' }); return [...sg.segment(s)].filter(x => x.isWordLike).map(x => x.segment); } catch (e) { return s.split(/\s+/); } };
      let sents = text.split(/\n+|(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length >= 18 && s.length <= 220);
      if (sents.length < Math.max(3, n)) { /* ภาษาไทยมักไม่มีจุด — ใช้ช่องว่างเป็นตัวแบ่งประโยค */ const parts = text.split(/\s+/).filter(Boolean), merged = []; let cur = ''; parts.forEach(w => { cur = cur ? cur + ' ' + w : w; if (cur.length >= 18) { merged.push(cur); cur = ''; } }); if (cur) merged.length ? merged[merged.length - 1] += ' ' + cur : merged.push(cur); sents = [...new Set(sents.concat(merged.filter(x => x.length <= 220)))]; }
      const words = {}; seg(text).forEach(w => { w = w.trim(); if (w.length >= 3 && !/^\d+$/.test(w)) words[w] = (words[w] || 0) + 1; });
      const kws = Object.entries(words).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).map(x => x[0]); const out = [];
      if (kind === 'summary') return [{ type: 'summary', text: 'สรุปย่อ:\n' + sents.slice(0, Math.max(3, Math.min(6, n))).map(s => '• ' + s).join('\n') + '\n\nคำสำคัญ: ' + kws.slice(0, 10).join(', ') }];
      if (kind === 'discuss') return kws.slice(0, n).map(k => ({ type: 'open', text: `ถ้า "${k}" เปลี่ยนแปลงไป จะส่งผลต่อเรื่องที่เรียนอย่างไร? ให้เหตุผลประกอบ`, points: 0 }));
      for (const s of shuffle(sents)) {
        if (out.length >= n) break; const ws = seg(s).filter(w => w.length >= 3 && !/^\d+$/.test(w)); if (!ws.length) continue; const key = ws.sort((a, b) => (words[b] || 0) * 2 + b.length - ((words[a] || 0) * 2 + a.length))[0];
        const dis = shuffle(kws.filter(k => k !== key)).slice(0, 3); if (kind === 'mc') { if (dis.length < 3) continue; const opts = shuffle([key, ...dis]); out.push({ type: 'mc', text: s.replace(key, '_____'), options: opts, correct: [opts.indexOf(key)], points: 10, time: 20 }); }
        else if (kind === 'tf') { const truth = Math.random() < .5 || !dis.length; out.push({ type: 'tf', text: truth ? s : s.replace(key, dis[0]), correct: [truth ? 0 : 1], points: 10, time: 15 }); }
        else out.push({ type: 'open', text: 'อธิบายด้วยคำพูดของตัวเอง: "' + (s.length > 90 ? s.slice(0, 90) + '…' : s) + '"', points: 0 });
      }
      return out;
    }
  },
  custom: {
    name: 'API ที่เข้ากันได้กับ OpenAI (ตั้งค่าเอง)',
    async generate(text, kind, n, cfg) {
      if (!cfg.endpoint) throw new Error('ยังไม่ได้ตั้งค่า Endpoint');
      const spec = { mc: 'multiple-choice with 4 options', tf: 'true/false', open: 'open-ended', summary: 'summary', discuss: 'discussion prompts' }[kind];
      const prompt = `Create ${n} ${spec} items in Thai from the text. Reply ONLY JSON array. For mc: {"type":"mc","text":"","options":["","","",""],"correct":[0],"points":10}. For tf: {"type":"tf","text":"","correct":[0 or 1 (0=true)],"points":10}. For open/discuss: {"type":"open","text":""}. For summary: [{"type":"summary","text":""}].\n\nTEXT:\n${text.slice(0, 12000)}`;
      const r = await fetch(cfg.endpoint, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, cfg.key ? { Authorization: 'Bearer ' + cfg.key } : {}), body: JSON.stringify({ model: cfg.model || 'gpt-4o-mini', messages: [{ role: 'user', content: prompt }], temperature: .4 }) });
      if (!r.ok) throw new Error('API ตอบกลับ ' + r.status); const j = await r.json(); const c = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ''; const m = c.match(/\[[\s\S]*\]/); if (!m) throw new Error('รูปแบบผลลัพธ์ไม่ถูกต้อง'); return JSON.parse(m[0]);
    }
  }
};

      el.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><div style="font-size:2.4rem">🔒</div><h2 style="margin:6px 0">${T('ตั้งค่าระบบ', 'System settings')}</h2><p class="small muted" style="margin-top:0">${T('กรอกรหัสผ่านเพื่อเข้าตั้งค่าระบบ', 'Enter the password to continue')}</p>
        <input class="inp" id="lkPw" type="password" autocomplete="current-password" placeholder="${T('รหัสผ่าน', 'Password')}" style="text-align:center;font-size:1.1rem"><div class="small" id="lkMsg" style="min-height:1.4em;margin:8px 0;color:var(--bad)"></div>
        <button class="btn pri" id="lkGo" style="width:100%">${T('ปลดล็อก', 'Unlock')}</button><div style="margin-top:12px"><button class="btn sm ghost" id="lkForgot">${T('ลืมรหัสผ่าน?', 'Forgot password?')}</button></div></div>`;
      const pw = $('#lkPw', el), msg = $('#lkMsg', el); let busy = false; setTimeout(() => pw.focus(), 40);
      const go = async () => { if (busy) return; busy = true; $('#lkGo', el).disabled = true; msg.textContent = ''; const r = await Lock.unlock(pw.value); busy = false; $('#lkGo', el).disabled = false; if (r.ok) { frame(); return; } pw.value = ''; pw.focus(); msg.textContent = r.wait ? T(`ใส่ผิดหลายครั้ง — รอ ${r.wait} วินาที`, `Too many attempts — wait ${r.wait}s`) : T(`รหัสผ่านไม่ถูกต้อง (เหลือ ${r.left} ครั้ง)`, 'Wrong password'); };
      $('#lkGo', el).onclick = go; pw.onkeydown = e => { if (e.key === 'Enter') go(); };
      $('#lkForgot', el).onclick = forgot;
    };
    function forgot() {
      const hasRc = !!(DB.settings.lock && DB.settings.lock.rc);
      modal({
        title: T('ลืมรหัสผ่าน', 'Forgot password'),
        body: Lock.isDefault() ? `<p>${T('ตอนนี้ยังใช้รหัสเริ่มต้นของระบบอยู่ — ติดต่อผู้ติดตั้งระบบเพื่อขอรหัสเริ่มต้น', 'The default password is still in use — ask whoever installed the app.')}</p>`
          : hasRc ? `<p class="small" style="margin-top:0">${T('กรอกรหัสกู้คืน (ได้ตอนตั้งรหัสผ่าน) แล้วตั้งรหัสใหม่', 'Enter your recovery code and choose a new password')}</p><label class="f">${T('รหัสกู้คืน', 'Recovery code')}</label><input class="inp" id="fgC" placeholder="XXXX-XXXX-XXXX-XXXX" style="letter-spacing:.06em"><label class="f">${T('รหัสผ่านใหม่', 'New password')}</label><input class="inp" id="fgP" type="password" autocomplete="new-password"><label class="f">${T('ยืนยันรหัสผ่านใหม่', 'Confirm')}</label><input class="inp" id="fgP2" type="password" autocomplete="new-password">`
          : `<p>${T('ไม่พบรหัสกู้คืนในเครื่องนี้', 'No recovery code on this device')}</p>`,
        actions: [{ label: T('ปิด', 'Close') }, ...(!Lock.isDefault() && hasRc ? [{ label: T('ตั้งรหัสใหม่', 'Reset'), cls: 'pri', onClick: async () => { const p1 = $('#fgP').value, e = Lock.policy(p1); if (e) { toast(e, 'err', 3200); return false; } if (p1 !== $('#fgP2').value) { toast(T('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'Passwords do not match'), 'err'); return false; } const code = await Lock.resetByCode($('#fgC').value, p1); if (!code) { toast(T('รหัสกู้คืนไม่ถูกต้อง', 'Invalid recovery code'), 'err', 3000); return false; } setTimeout(async () => { await Lock.showCode(code); toast(T('ตั้งรหัสผ่านใหม่แล้ว — ปลดล็อกด้วยรหัสใหม่', 'Password reset'), 'ok', 3200); }, 60); } }] : [])]
      });
    }
    const frame = () => {
      if (!Lock.ok()) return gate(); Lock.touch();
      el.innerHTML = `<div class="row" style="margin-bottom:14px"><h2 style="margin:0">${T('ตั้งค่าระบบ', 'System settings')}</h2><span class="sp"></span>${Lock.supported() ? `<button class="btn sm" id="lkNow">🔒 ${T('ล็อกเดี๋ยวนี้', 'Lock now')}</button>` : ''}</div>${Lock.supported() && Lock.isDefault() ? `<div class="card" style="border-color:var(--pink2);background:#fff8fa;margin-bottom:14px;padding:10px 14px"><span class="small">⚠ ${T('ยังใช้รหัสผ่านเริ่มต้นอยู่ — ควรเปลี่ยนที่แท็บ “ความปลอดภัย”', 'Still using the default password — change it in the Security tab')}</span></div>` : ''}<div class="tabs" id="stt" style="margin-bottom:14px">${[['general', T('ทั่วไป', 'General')], ['support', 'Developer Support'], ['data', T('ข้อมูล/สำรอง', 'Data & backup')], ['privacy', 'Privacy'], ['logs', 'Logs'], ['security', T('ความปลอดภัย', 'Security')]].map(t => `<button data-t="${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div><div id="stb"></div>`;
      $$('#stt [data-t]', el).forEach(b => b.onclick = () => { tab = b.dataset.t; frame(); }); const b = $('#stb', el); ({ general, support: supportAdmin, data, privacy, logs, security })[tab](b); const ln = $('#lkNow', el); if (ln) ln.onclick = () => { Lock.lock(); gate(); };
    };
    function general(b) {
      const S = DB.settings;
      b.innerHTML = `<div class="card" style="max-width:640px"><label class="f" style="margin-top:0">${T('ชื่อระบบ', 'System name')}</label><input class="inp" id="gN" value="${esc(S.systemName)}"><label class="f">${T('ชื่อครู (แสดงในแดชบอร์ด)', 'Teacher name')}</label><input class="inp" id="gT" value="${esc(S.teacherName)}">
      <label class="f">${T('ที่อยู่เว็บจริงของแอป (สำหรับ QR/ลิงก์เข้าห้อง) เช่น https://username.github.io/classroom/', 'Public URL of this app (for QR/join links)')}</label><input class="inp" id="gU" value="${esc(S.publicUrl)}" placeholder="${esc(location.protocol === 'file:' ? 'https://…' : location.origin + location.pathname)}">
      <label class="f">${T('ภาษา', 'Language')}</label><select class="sel" id="gL"><option value="th" ${DB.lang === 'th' ? 'selected' : ''}>ไทย</option><option value="en" ${DB.lang === 'en' ? 'selected' : ''}>English</option></select>
      <div class="row" style="margin-top:14px"><button class="btn pri" id="gS">${ic('save', 16)} ${T('บันทึก', 'Save')}</button></div></div>`;
      $('#gS', b).onclick = () => { S.systemName = $('#gN', b).value.trim() || CONFIG.appName; S.teacherName = $('#gT', b).value.trim(); S.publicUrl = $('#gU', b).value.trim(); DB.lang = $('#gL', b).value; saveNow(); buildShell(); route(); toast(T('บันทึกแล้ว', 'Saved')); };
    }
    function data(b) {
      let size = 0; try { size = (localStorage.getItem(LS_KEY) || '').length; } catch (e) { }
      b.innerHTML = `<div class="grid g2"><div class="card"><h3>${T('สำรองและกู้คืน', 'Backup & restore')}</h3><p class="small muted">${T('ข้อมูลห้องเรียน/แบบทดสอบ/รายงาน/คะแนน อยู่ในเบราว์เซอร์เครื่องนี้ ควรสำรองเป็นไฟล์เป็นระยะ (บทเรียนและ PDF สำรองได้ที่ Teaching Studio → ส่งออก → .json)', 'Class data is stored in this browser. Back up regularly.')}</p><div class="small">${T('ขนาดข้อมูลปัจจุบัน', 'Size')}: ${(size / 1024).toFixed(1)} KB</div>
        <div class="row" style="margin-top:10px"><button class="btn pri" id="bk">${ic('down', 16)} ${T('สำรองข้อมูล (.json)', 'Back up')}</button><button class="btn" id="rs">${ic('up', 16)} ${T('กู้คืนจากไฟล์', 'Restore')}</button><input type="file" id="rsf" accept=".json" class="hide"></div></div>
        <div class="card"><h3 style="color:var(--bad)">${T('ล้างข้อมูล', 'Reset')}</h3><p class="small muted">${T('ลบข้อมูลทั้งหมดในเบราว์เซอร์นี้ (ห้องเรียน แบบทดสอบ รายงาน การตั้งค่า)', 'Delete all data in this browser')}</p><button class="btn danger" id="wipe">${ic('trash', 16)} ${T('ล้างข้อมูลทั้งหมด', 'Erase everything')}</button></div></div>`;
      $('#bk', b).onclick = () => { downloadBlob(`sic-backup-${today()}.json`, JSON.stringify(DB), 'application/json'); logEvent('backup', 'export'); };
      $('#rs', b).onclick = () => $('#rsf', b).click();
      $('#rsf', b).onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const o = safeParse(await readFile(f, 'text')); if (!o || typeof o !== 'object' || !Array.isArray(o.classes)) throw new Error('bad'); if (!await confirmBox(T('แทนที่ข้อมูลปัจจุบันด้วยไฟล์สำรอง?', 'Replace current data with this backup?'))) return; DB = Object.assign(defaultDB(), o); saveNow(); buildShell(); route(); toast(T('กู้คืนแล้ว', 'Restored')); } catch (er) { toast(T('ไฟล์สำรองไม่ถูกต้อง', 'Invalid backup'), 'err'); } };
      $('#wipe', b).onclick = async () => { if (await confirmBox(T('ลบข้อมูลทั้งหมดถาวร? (แนะนำให้สำรองก่อน)', 'Erase all data?'), T('ลบทั้งหมด', 'Erase'))) { localStorage.removeItem(LS_KEY); DB = loadDB(); saveNow(); buildShell(); route(); toast(T('ล้างแล้ว', 'Cleared')); } };
    }
    function privacy(b) {
      const S = DB.settings;
      b.innerHTML = `<div class="grid g2"><div class="card"><h3>${T('นโยบายความเป็นส่วนตัว', 'Privacy policy')}</h3><textarea class="ta" id="pp" style="min-height:220px">${esc(S.privacy || DEFAULT_PRIVACY)}</textarea></div><div class="card"><h3>${T('เงื่อนไขการใช้งาน', 'Terms of use')}</h3><textarea class="ta" id="tt" style="min-height:220px">${esc(S.terms || DEFAULT_TERMS)}</textarea></div></div><div class="row" style="margin-top:12px"><button class="btn pri" id="ps">${T('บันทึก', 'Save')}</button></div>`;
      $('#ps', b).onclick = () => { S.privacy = $('#pp', b).value; S.terms = $('#tt', b).value; save(); toast(T('บันทึกแล้ว', 'Saved')); };
    }
    function logs(b) {
      const L = DB.logs || [];
      b.innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">System Logs <span class="chip">${L.length}</span></h3><span class="sp"></span><button class="btn sm" id="lg">${ic('down', 14)} CSV</button><button class="btn sm danger" id="lc">${T('ล้าง', 'Clear')}</button></div><div class="tw" style="margin-top:8px;max-height:420px;overflow:auto"><table class="t"><thead><tr><th>${T('เวลา', 'Time')}</th><th>${T('เหตุการณ์', 'Event')}</th><th>${T('รายละเอียด', 'Detail')}</th></tr></thead><tbody>${L.map(x => `<tr><td>${fmtDT(x.ts)}</td><td>${esc(x.a)}</td><td>${esc(x.d)}</td></tr>`).join('') || `<tr><td colspan="3" class="muted" style="text-align:center;padding:20px">—</td></tr>`}</tbody></table></div></div>`;
      $('#lg', b).onclick = () => downloadBlob('system-logs.csv', toCSV([['time', 'event', 'detail'], ...L.map(x => [new Date(x.ts).toISOString(), x.a, x.d])]), 'text/csv'); $('#lc', b).onclick = () => { DB.logs = []; save(); logs(b); };
    }
    function security(b) {
      const sup = Lock.supported(), mins = Lock.mins();
      b.innerHTML = `<div class="card" style="max-width:560px"><h3 style="margin-top:0">🔐 ${T('รหัสผ่านตั้งค่าระบบ', 'Settings password')} <span class="chip ${Lock.isDefault() ? 'warn' : 'ok'}">${Lock.isDefault() ? T('รหัสเริ่มต้น', 'Default') : T('ตั้งรหัสเองแล้ว', 'Custom')}</span></h3>
        ${sup ? `<label class="f">${T('รหัสผ่านปัจจุบัน', 'Current password')}</label><input class="inp" id="scO" type="password" autocomplete="current-password"><label class="f">${T('รหัสผ่านใหม่', 'New password')}</label><input class="inp" id="scN" type="password" autocomplete="new-password"><label class="f">${T('ยืนยันรหัสผ่านใหม่', 'Confirm new password')}</label><input class="inp" id="scN2" type="password" autocomplete="new-password">
        <div class="row" style="margin-top:12px"><button class="btn pri" id="scGo">${ic('save', 16)} ${T('เปลี่ยนรหัสผ่าน', 'Change password')}</button></div>
        <label class="f" style="margin-top:16px">${T('ล็อกอัตโนมัติเมื่อไม่ได้ใช้งาน', 'Auto-lock after idle')}</label><select class="sel" id="scM" style="width:auto">${[[1, '1'], [5, '5'], [10, '10'], [30, '30'], [60, '60'], [0, T('ไม่ล็อกอัตโนมัติ (จนกว่าจะรีเฟรช)', 'Never (until reload)')]].map(x => `<option value="${x[0]}" ${mins === x[0] ? 'selected' : ''}>${x[0] === 0 ? x[1] : x[1] + ' ' + T('นาที', 'min')}</option>`).join('')}</select>
        <p class="tiny muted" style="margin:14px 0 0">${T('รหัสผ่านเก็บเป็นค่าแฮชเค็ม (PBKDF2-SHA256) ไม่เก็บเป็นข้อความ · เป็นการล็อกหน้าตั้งค่าเพื่อกันการกดโดยไม่ตั้งใจ ไม่ใช่การเข้ารหัสตัวข้อมูลในเบราว์เซอร์ · ถ้าสำรองข้อมูลแล้วกู้คืน รหัสผ่านจะกลับไปเป็นของไฟล์สำรองนั้น', 'Stored as a salted PBKDF2-SHA256 hash. This locks the settings page; it does not encrypt data stored in the browser.')}</p>` : `<p class="small">${T('เบราว์เซอร์/โหมดนี้ไม่รองรับการเข้ารหัส (ต้องเปิดผ่าน https หรือ localhost) — ล็อกหน้าตั้งค่าไม่ทำงาน', 'This browser/context lacks WebCrypto (use https) — the lock is disabled')}</p>`}</div>`;
      if (!sup) return;
      $('#scM', b).onchange = e => { DB.settings.lockMin = +e.target.value; save(); Lock.touch(); toast(T('บันทึกแล้ว', 'Saved')); };
      $('#scGo', b).onclick = async () => {
        const btn = $('#scGo', b), o = $('#scO', b).value, n = $('#scN', b).value, n2 = $('#scN2', b).value; const e = Lock.policy(n);
        if (e) return toast(e, 'err', 3200); if (n !== n2) return toast(T('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน', 'Passwords do not match'), 'err'); if (n === o) return toast(T('รหัสใหม่ต้องต่างจากรหัสเดิม', 'Choose a different password'), 'err');
        btn.disabled = true; if (!await Lock.check(o)) { btn.disabled = false; return toast(T('รหัสผ่านปัจจุบันไม่ถูกต้อง', 'Current password is wrong'), 'err', 3000); }
        const code = await Lock.setPass(n); btn.disabled = false; await Lock.showCode(code); toast(T('เปลี่ยนรหัสผ่านแล้ว', 'Password changed'), 'ok', 2600); frame();
      };
    }
    if (Lock.supported()) lkIv = setInterval(() => { if (!document.body.contains(el)) { clearInterval(lkIv); return; } if (!Lock.ok() && !$('#lkPw', el)) gate(); }, 4000);
    el.addEventListener('pointerdown', () => Lock.touch(), true); el.addEventListener('keydown', () => Lock.touch(), true);
    frame();
    return () => clearInterval(lkIv);
  }
};
const DEFAULT_PRIVACY = 'แอปนี้เก็บข้อมูลห้องเรียน แบบทดสอบ และคะแนน ไว้ในเบราว์เซอร์ของอุปกรณ์ที่ใช้งานเท่านั้น ไม่มีการอัปโหลดไปยังเซิร์ฟเวอร์ของผู้พัฒนา\n\nห้องสด (Live Room) ใช้การเชื่อมต่อ WebRTC ระหว่างอุปกรณ์ โดยใช้เซิร์ฟเวอร์สาธารณะของ PeerJS เพื่อจับคู่การเชื่อมต่อเท่านั้น\n\nกล้อง: ขออนุญาตทุกครั้ง ประมวลผลในเครื่อง ไม่บันทึกภาพ ไม่ใช้การจดจำใบหน้าเพื่อระบุตัวตน\n\nครูควรแจ้งนักเรียน/ผู้ปกครองและเก็บข้อมูลเท่าที่จำเป็น ตามกฎหมายคุ้มครองข้อมูลส่วนบุคคล (PDPA)';
const DEFAULT_TERMS = 'ใช้งานเพื่อการเรียนการสอน ผู้ใช้รับผิดชอบเนื้อหาที่นำเข้า และต้องมีสิทธิ์ใช้ไฟล์ที่นำมาแสดง\nการสนับสนุนผู้พัฒนาเป็นไปโดยสมัครใจ ไม่มีผลต่อสิทธิ์การใช้งาน\nซอฟต์แวร์ให้ใช้ตามสภาพ ไม่มีการรับประกันความเสียหายจากการสูญหายของข้อมูล โปรดสำรองข้อมูลเป็นประจำ';

/* ---------- boot ---------- */
(function boot() {
  const qp = new URLSearchParams(location.search); const j = qp.get('join'), d = qp.get('display');
  window.addEventListener('beforeunload', e => { if (typeof Live !== 'undefined' && Live.active) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('unhandledrejection', e => console.warn('unhandled', e.reason));
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if (Code.norm(j)) return bootStudent(Code.norm(j), 'student', qp.get('name') || '');
  if (Code.norm(d)) return bootDisplay(Code.norm(d));
  if (qp.get('app') === 'meeting') return bootMeetApp();
  const mt = qp.get('meet'); if (Code.norm(mt)) return bootMeet(Code.norm(mt), qp.get('name') || '');
  const mdp = qp.get('mdisplay'); if (Code.norm(mdp)) return bootMeetDisplay(Code.norm(mdp));
  const mr = qp.get('mirror'); if (Code.norm(mr)) return bootMirror(Code.norm(mr));
  const rm = qp.get('remote'); if (Code.norm(rm)) return bootRemote(Code.norm(rm));
  buildShell(); window.addEventListener('hashchange', route); route();
  { let c = qp.get('co'); if (!Code.norm(c)) { try { c = sessionStorage.getItem('sic.co'); } catch (e) { c = null; } } if (Code.norm(c)) { c = Code.norm(c); Co.connect(c); if (qp.get('co')) { history.replaceState(null, '', location.pathname + location.hash); setTimeout(() => toast('🔗 ' + T('เชื่อมกับ Studio หลักแล้ว — เปิดบทเรียน → Teaching Studio เพื่อเริ่มนำเสนอ', 'Linked — open a lesson in Teaching Studio'), 'ok', 5000), 600); } } }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
