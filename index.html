<title>SMART INTERACTIVE CLASSROOM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142B4A'/%3E%3Crect x='12' y='16' width='40' height='26' rx='4' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M32 42v10M22 52h20' stroke='%23F2B8C6' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='29' r='5' fill='%23F2B8C6'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142B4A'/%3E%3Crect x='12' y='16' width='40' height='26' rx='4' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M32 42v10M22 52h20' stroke='%23F2B8C6' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='29' r='5' fill='%23F2B8C6'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#142B4A;--deep:#0B1B33;--pink:#F2B8C6;--pink2:#e98fa6;--lblue:#DCEBFA;--white:#fff;--bg:#F5F7FB;
  --tx:#1E293B;--tx2:#64748B;--line:#E3E9F3;--ok:#1f9d6b;--warn:#d98a1c;--bad:#d64561;
  --r:16px;--sh:0 6px 24px rgba(20,43,74,.08);--sh2:0 2px 8px rgba(20,43,74,.08);
  --font:'Noto Sans Thai','IBM Plex Sans Thai','Sarabun','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --side:248px;--top:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;color:var(--navy);line-height:1.25}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
p{margin:.3em 0}
a{color:var(--navy)}
.muted{color:var(--tx2)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.hide{display:none!important}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr;height:100%;height:100dvh}
.side{grid-row:1/3;background:linear-gradient(180deg,var(--navy),var(--deep));color:#dbe6f5;display:flex;flex-direction:column;padding:14px 12px;overflow:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff;font-weight:700;letter-spacing:.02em;line-height:1.15}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),#fff);display:grid;place-items:center;color:var(--navy);flex:none}
.brand small{display:block;font-weight:500;color:#9fb4d3;font-size:.68rem;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#c6d4ea;text-decoration:none;cursor:pointer;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(242,184,198,.18);color:#fff;box-shadow:inset 3px 0 0 var(--pink)}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side .foot{margin-top:auto;padding-top:14px}
.side .tiny-link{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:#8ea5c8;font-size:.82rem;text-decoration:none;cursor:pointer}
.side .tiny-link:hover{color:var(--pink);background:rgba(255,255,255,.05)}
.side .tiny-link svg{width:16px;height:16px}
.top{grid-column:2;display:flex;align-items:center;gap:10px;padding:0 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:20}
.top h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .menu-btn{display:none}
main{grid-column:2;overflow:auto;padding:22px;position:relative;-webkit-overflow-scrolling:touch}
main.flush{padding:0;overflow:hidden}
.bottom{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.15s;min-height:42px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#c9d6ea;box-shadow:var(--sh2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#1b3a63}
.btn.pink{background:var(--pink);border-color:var(--pink);color:var(--deep)}
.btn.pink:hover{background:#f6c9d4}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;min-height:34px;font-size:.88rem;border-radius:10px}
.btn.icon{padding:0;width:42px}.btn.icon.sm{width:34px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.on{background:var(--lblue);border-color:#b9d3f1}
.inp,.sel,.ta{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;min-height:42px;outline:none;transition:.15s}
.ta{min-height:84px;resize:vertical}
.inp:focus,.sel:focus,.ta:focus{border-color:#8fb3e3;box-shadow:0 0 0 3px rgba(143,179,227,.25)}
label.f{display:block;font-weight:600;font-size:.86rem;color:var(--navy);margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h3{display:flex;align-items:center;gap:8px}
.stat{display:flex;align-items:center;gap:14px}
.stat .ico{width:46px;height:46px;border-radius:14px;background:var(--lblue);color:var(--navy);display:grid;place-items:center}
.stat.pk .ico{background:#fbe3ea}
.stat b{display:block;font-size:1.55rem;color:var(--navy);line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--lblue);color:var(--navy);font-size:.8rem;font-weight:600}
.chip.pk{background:#fbe3ea}.chip.ok{background:#dcf5ea;color:#12714c}.chip.warn{background:#fdf0d7;color:#8a5a0c}.chip.bad{background:#fde2e8;color:#a52a45}
.empty{padding:34px 16px;text-align:center;color:var(--tx2);border:1.5px dashed var(--line);border-radius:var(--r);background:rgba(255,255,255,.6)}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#24457a 70%,#3a5c93 100%);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero h1,.hero h2{color:#fff}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(242,184,198,.55),transparent 68%)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px;position:relative;z-index:1}
.qa button{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;text-align:left;transition:.15s}
.qa button:hover{background:rgba(255,255,255,.22)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;color:var(--tx2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
table.t td{padding:9px 10px;border-bottom:1px solid #eef2f8;vertical-align:middle}
.tw{overflow:auto;border-radius:12px}
.tabs{display:flex;gap:4px;background:#e9eff8;padding:4px;border-radius:14px;overflow:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--tx2);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--sh2)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--navy)}
.bar{height:12px;border-radius:99px;background:#e9eff8;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#4a76b8);border-radius:99px;transition:width .35s}
.bar i.ok{background:linear-gradient(90deg,#1f9d6b,#52c79a)}
.pb{display:flex;align-items:center;gap:10px;margin:6px 0}
.pb .lab{width:34%;min-width:80px}.pb .bar{flex:1}.pb .n{width:42px;text-align:right;font-weight:700;color:var(--navy)}

/* ---------- toast / modal ---------- */
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:999;align-items:center;pointer-events:none}
.toast{background:var(--deep);color:#fff;padding:10px 18px;border-radius:14px;box-shadow:var(--sh);animation:up .25s;max-width:88vw;pointer-events:auto}
.toast.err{background:var(--bad)}.toast.ok{background:var(--navy)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mask{position:fixed;inset:0;background:rgba(11,27,51,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:500;padding:14px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal header{display:flex;align-items:center;padding:16px 20px 6px}
.modal header h3{flex:1;margin:0;font-size:1.1rem}
.modal .bd{padding:6px 20px 14px;overflow:auto}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 132px;grid-template-rows:auto 1fr;height:100%;background:#e8edf5}
.studio .bar-top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.studio .name{border:1px solid transparent;background:transparent;font-weight:700;color:var(--navy);font-size:1.02rem;border-radius:10px;padding:6px 10px;min-width:120px;max-width:300px}
.studio .name:hover,.studio .name:focus{border-color:var(--line);background:#fff;outline:none}
.studio>*{min-width:0;min-height:0}
.stage{position:relative;overflow:hidden;background:#cfd8e6;min-height:200px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas.main,.stage canvas.fx{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage canvas.fx{pointer-events:none}
.ri-note{background:#f4f8ff;border:1px solid #d8e4f7;border-radius:12px;padding:8px 12px;font-size:.84rem;line-height:1.75;color:var(--navy)}
.ri-t{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.ri-t table{width:100%;border-collapse:collapse;font-size:.86rem}
.ri-t th{position:sticky;top:0;background:#f4f7fb;text-align:left;padding:6px 8px;font-size:.74rem;color:var(--tx2);z-index:1}
.ri-t td{padding:2px 4px;border-top:1px solid var(--line)}
.ri-t input,.ri-t select{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font:inherit;color:inherit}
.ri-t input:focus,.ri-t select:focus{border-color:var(--navy);background:#fff;outline:none}
.stage,#rStage,.draw-pad,canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage:fullscreen{background:#111}
.pages{overflow:auto;background:#fff;border-left:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px}
.pg{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;background:#fff;flex:none}
.pg.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--pink)}
.pg canvas{display:block;width:100%;height:auto}
.pg .no{position:absolute;left:4px;bottom:4px;background:rgba(20,43,74,.8);color:#fff;font-size:.7rem;border-radius:6px;padding:0 6px}
.tb{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;max-width:calc(100% - 20px);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(20,43,74,.22);display:flex;align-items:center;gap:2px;padding:6px 8px;z-index:6;overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb .tbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--navy);flex:none;position:relative}
.tb .tbtn:hover{background:#eef3fa}
.tb .tbtn.on{background:var(--navy);color:#fff}
.tb .tbtn[disabled]{opacity:.3;pointer-events:none}
.tb .vsep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.tb .cur{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--navy)}
.pop{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 14px 36px rgba(20,43,74,.25);z-index:7;width:min(340px,calc(100% - 20px))}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.pop label{font-size:.8rem;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;margin:10px 0 2px}
.pop input[type=range]{width:100%;accent-color:var(--navy)}
.selbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:6px 8px;display:flex;gap:4px;z-index:6;box-shadow:var(--sh)}
.selbar button{background:transparent;border:0;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.selbar button:hover{background:rgba(255,255,255,.15)}
.live-chip{position:absolute;top:10px;right:12px;z-index:6;background:rgba(20,43,74,.9);color:#fff;border-radius:99px;padding:4px 12px;font-size:.82rem;display:flex;gap:8px;align-items:center}
.pgnav{position:absolute;top:10px;left:12px;z-index:6;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:99px;display:flex;align-items:center;gap:2px;padding:2px 4px}
.pgnav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--navy);display:grid;place-items:center}
.pgnav button:hover{background:#eef3fa}
.media-win{position:absolute;right:14px;top:56px;width:min(420px,60%);background:#000;border-radius:14px;overflow:hidden;z-index:8;box-shadow:var(--sh)}
.media-win .mh{display:flex;justify-content:space-between;align-items:center;background:var(--deep);color:#fff;padding:4px 8px;font-size:.8rem}
.media-win video,.media-win iframe,.media-win audio{width:100%;display:block;border:0;aspect-ratio:16/9;background:#000}
.media-win audio{aspect-ratio:auto}

/* ---------- wheel / tools ---------- */
.wheel-wrap{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-wrap .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid var(--deep);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.result-big{font-size:1.6rem;font-weight:800;color:var(--navy);text-align:center;min-height:2.2em;display:flex;align-items:center;justify-content:center;padding:6px}
.gcard{border-radius:16px;padding:14px;border:2px solid var(--line);background:#fff}
.gcard h3{display:flex;justify-content:space-between;align-items:center}
.gcard ul{list-style:none;margin:6px 0 0;padding:0}
.gcard li{padding:5px 0;border-bottom:1px dashed #e6ecf6;display:flex;align-items:center;gap:8px}
.gcard li:last-child{border:0}
.cam-box{position:relative;background:#0b1b33;border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-height:70vh;width:100%}
.cam-box video,.cam-box canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.seat-grid{display:grid;gap:8px}
.seat{border:1.5px solid var(--line);border-radius:12px;min-height:56px;padding:4px 6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.82rem;cursor:pointer;background:#fff;transition:.12s;word-break:break-word}
.seat:hover{border-color:#9bb8e3}.seat.empty{color:#b3bdcc;background:#f8fafd;border-style:dashed}
.seat.sel{outline:3px solid var(--pink)}.seat.abs{background:#fde2e8;text-decoration:line-through;color:#a52a45}
.score-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.score-row .rk{width:30px;height:30px;border-radius:50%;background:var(--lblue);display:grid;place-items:center;font-weight:800;color:var(--navy);flex:none}
.score-row:nth-child(1) .rk{background:linear-gradient(135deg,#ffe28a,#f0b429)}
.score-row:nth-child(2) .rk{background:#e5e9ef}.score-row:nth-child(3) .rk{background:#f3d3b8}
.score-row .sc{font-weight:800;font-size:1.15rem;color:var(--navy)}
.mbox{aspect-ratio:1;border-radius:16px;background:linear-gradient(135deg,var(--navy),#3a5c93);color:#fff;display:grid;place-items:center;font-size:2rem;cursor:pointer;transition:.2s;text-align:center;padding:6px;font-weight:700}
.mbox:hover{transform:scale(1.04) rotate(-2deg)}.mbox.open{background:linear-gradient(135deg,var(--pink),#fff);color:var(--navy);font-size:.95rem}
.timer-big{font-size:min(22vw,7rem);font-weight:800;color:var(--navy);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---------- quiz ---------- */
.q-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.q-item .num{width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.opt-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.opt-row input[type=radio],.opt-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);flex:none}
.opt-btn{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;margin:8px 0;transition:.12s;font-size:1rem}
.opt-btn:hover{border-color:#9bb8e3}.opt-btn.on{border-color:var(--navy);background:var(--lblue)}
.opt-btn.right{border-color:var(--ok);background:#dcf5ea}.opt-btn.wrong{border-color:var(--bad);background:#fde2e8}
.stars{display:flex;gap:6px;font-size:2.2rem;cursor:pointer;color:#cfd8e6;user-select:none}
.stars span.on{color:#f0b429}
.wc{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:10px;min-height:120px}
.wc span{font-weight:800;color:var(--navy);line-height:1}
.draw-pad{border:2px solid var(--line);border-radius:14px;background:#fff;touch-action:none;width:100%;display:block}

      var bytes = [];

        if (c < 128) {

/* ---------- IndexedDB (ไฟล์ใหญ่: บทเรียน/รูป/PDF) with in-memory fallback ---------- */
const IDB = (() => {
  let dbp = null; const mem = { lessons: new Map(), imgs: new Map() }; let broken = false;
  function open() {
    return dbp || (dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('sic-classroom', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('lessons', { keyPath: 'id' }); d.createObjectStore('imgs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    }));
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const o = t.objectStore(store); const rq = fn(o);
      t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
    });
  }
  async function wrap(store, op, key, val) {
    if (!broken) {
      try {
        if (op === 'get') return await tx(store, 'readonly', o => o.get(key));
        if (op === 'put') return await tx(store, 'readwrite', o => store === 'lessons' ? o.put(val) : o.put(val, key));
        if (op === 'del') return await tx(store, 'readwrite', o => o.delete(key));
      } catch (e) { console.warn('IndexedDB ใช้ไม่ได้ ใช้หน่วยความจำชั่วคราวแทน', e); broken = true; }
    }
    const m = mem[store];
    if (op === 'get') return m.get(key);
    if (op === 'put') { m.set(store === 'lessons' ? val.id : key, val); return; }
    if (op === 'del') { m.delete(key); }
  }
  return {
    get: (s, k) => wrap(s, 'get', k), put: (s, v, k) => wrap(s, 'put', k, v), del: (s, k) => wrap(s, 'del', k),
    get broken() { return broken; }
  };
})();

function toast(msg, type = 'ok', ms = 2600) {
  let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320); }, ms);
}
function modal({ title = '', body = '', actions = [], wide = false, onMount, noClose = false } = {}) {
  const m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true"><header><h3>${esc(title)}</h3>${noClose ? '' : `<button class="btn ghost icon sm" data-x aria-label="close">${ic('x')}</button>`}</header><div class="bd"></div>${actions.length ? '<footer></footer>' : ''}</div>`;
  const bd = $('.bd', m); if (typeof body === 'string') bd.innerHTML = body; else bd.appendChild(body);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' && !noClose) close(); };
  document.addEventListener('keydown', onKey);
  const ft = $('footer', m);
  actions.forEach(a => {
    const b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.innerHTML = a.label;
    b.onclick = async () => { const r = a.onClick ? await a.onClick(m, close) : undefined; if (r !== false && !a.keep) close(); };
    ft.appendChild(b);
  });
  const x = $('[data-x]', m); if (x) x.onclick = close;
  if (!noClose) m.addEventListener('pointerdown', e => { if (e.target === m) close(); });
  document.body.appendChild(m);
  if (onMount) onMount(m, close);
  return { el: m, close };
}
function askText(title, def = '', { multiline = false, placeholder = '', label = '' } = {}) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const m = modal({
      title, body: `${label ? `<label class="f">${esc(label)}</label>` : ''}${multiline ? `<textarea class="ta" id="_ask" placeholder="${esc(placeholder)}">${esc(def)}</textarea>` : `<input class="inp" id="_ask" value="${esc(def)}" placeholder="${esc(placeholder)}">`}`,
      actions: [{ label: T('ยกเลิก', 'Cancel'), onClick: () => fin(null) }, { label: T('ตกลง', 'OK'), cls: 'pri', onClick: () => { fin($('#_ask', document).value); } }],
      onMount: mm => { const i = $('#_ask', mm); setTimeout(() => { i.focus(); i.select && i.select(); }, 30); if (!multiline) i.addEventListener('keydown', e => { if (e.key === 'Enter') { fin(i.value); m.close(); } }); }
    });
    m.el.addEventListener('remove', () => fin(null));
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { fin(null); obs.disconnect(); } });
    obs.observe(document.body, { childList: true });
  });
}
function confirmBox(msg, okLabel) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const m = modal({ title: T('ยืนยัน', 'Confirm'), body: `<p>${esc(msg)}</p>`, actions: [{ label: T('ยกเลิก', 'Cancel'), onClick: () => fin(false) }, { label: okLabel || T('ยืนยัน', 'Confirm'), cls: 'pri', onClick: () => fin(true) }] });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { fin(false); obs.disconnect(); } });
    obs.observe(document.body, { childList: true });
  });
}

/* ---------- lazy-load CDN libraries ---------- */
const _libs = {};
function loadLib(name) {
  const chk = { pdfjs: () => window.pdfjsLib, jspdf: () => window.jspdf, xlsx: () => window.XLSX, peer: () => window.Peer }[name];
  if (chk()) return Promise.resolve(chk());
  if (_libs[name]) return _libs[name];
  const urls = CONFIG.libs[name];
  return _libs[name] = (async () => {
    for (const u of urls) {
      try {
        await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = () => rej(new Error('fail ' + u)); document.head.appendChild(s); });
        if (chk()) { if (name === 'pdfjs') window.pdfjsLib.GlobalWorkerOptions.workerSrc = u.replace('pdf.min.js', 'pdf.worker.min.js'); return chk(); }
      } catch (e) { /* try next */ }
    }
    delete _libs[name];
    throw new Error(T('โหลดไลบรารีไม่สำเร็จ — ต้องเชื่อมต่ออินเทอร์เน็ต', 'Could not load library — internet required'));
  })();
}

/* ---- room codes: 8 random chars from a 32-symbol alphabet (no I L O U) = 32^8 ≈ 1.1×10^12 combinations, shown as ABCD-EFGH.
   Random source = crypto.getRandomValues; uniqueness among live rooms is enforced by the signalling server (an id can only be registered once).
   Legacy 6-digit codes are still accepted so old links keep working. ---- */
const Code = {
  A: '0123456789ABCDEFGHJKMNPQRSTVWXYZ',
  gen() { const b = new Uint8Array(8); (window.crypto || window.msCrypto).getRandomValues(b); let s = ''; for (let i = 0; i < 8; i++) s += this.A[b[i] & 31]; return s.slice(0, 4) + '-' + s.slice(4); },
  /* typed/scanned text → canonical code, or '' when invalid. Forgives case, spaces, hyphens and look-alikes (O→0, I/L→1) */
  norm(v) {
    let s = String(v || '').toUpperCase().replace(/[\s\-_.]/g, ''); if (/^\d{6}$/.test(s)) return s;
    s = s.replace(/O/g, '0').replace(/[IL]/g, '1'); return /^[0-9A-HJKMNP-TV-Z]{8}$/.test(s) ? s.slice(0, 4) + '-' + s.slice(4) : '';
  },
  pid(code) { const n = this.norm(code); return n.length === 6 ? 'sicl-' + n : 'sicl2-' + n.replace('-', ''); },
  bind(inp) { inp.setAttribute('autocapitalize', 'characters'); inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocorrect', 'off'); inp.setAttribute('spellcheck', 'false'); inp.maxLength = 9; inp.addEventListener('input', () => { const v = inp.value.toUpperCase().replace(/[^0-9A-Z]/g, ''); inp.value = /^\d+$/.test(v) && v.length <= 6 ? v : (v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4, 8) : v); }); }
};

   Lock — ล็อกหน้า “ตั้งค่าระบบ” ด้วยรหัสผ่าน
   - รหัสเริ่มต้นฝากไว้ในรูป “ค่าแฮชเค็ม” (PBKDF2-SHA256 150,000 รอบ) ไม่เก็บเป็นข้อความตรงๆ · เปลี่ยนรหัสเองได้ที่แท็บ “ความปลอดภัย”
   - รหัสที่ตั้งเองเก็บเป็นแฮชเค็มเช่นกัน (ไม่มีทางย้อนกลับเป็นรหัสเดิม) · ตั้งรหัสใหม่ทุกครั้งจะได้ “รหัสกู้คืน” แสดงครั้งเดียว
   - ปลดล็อกค้างไว้ตามเวลาที่ตั้ง (ค่าเริ่มต้น 10 นาที) แล้วล็อกเองอัตโนมัติ · ใส่ผิด 5 ครั้งต้องรอ
   หมายเหตุ: เป็นการกันคนทั่วไปที่หยิบเครื่องครูมาแตะ ไม่ใช่การเข้ารหัสตัวข้อมูลในเบราว์เซอร์
   ===================================================================== */
const Lock = {
  DEF: { s: 'AKmNopcmN/kpfAuQZAf9SQ==', h: '/+w8tGuvmTKrv2FfpuxpULSCFYOifVMCVQ/ItvEFXEI=', i: 150000 },
  until: 0, fails: 0, blockUntil: 0,
  supported() { return !!(window.crypto && crypto.subtle && window.isSecureContext !== false); },
  rec() { return DB.settings.lock || this.DEF; },
  isDefault() { return !DB.settings.lock; },
  mins() { const m = DB.settings.lockMin; return m === 0 || m > 0 ? +m : 10; },
  ok() { return !this.supported() || Date.now() < this.until; },
  touch() { if (Date.now() < this.until && this.until !== Infinity) { const m = this.mins(); this.until = m ? Date.now() + m * 60000 : Infinity; } },
  lock() { this.until = 0; },
  b64(u8) { let s = ''; u8.forEach(x => s += String.fromCharCode(x)); return btoa(s); },
  unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  async derive(pw, salt, iter) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw).normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, k, 256));
  },
  same(a, b) { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; },
  async check(pw, r) { r = r || this.rec(); try { return this.same(await this.derive(pw, this.unb64(r.s), r.i), this.unb64(r.h)); } catch (e) { return false; } },
  /* ปลดล็อก → { ok, wait } */
  async unlock(pw) {
    const now = Date.now(); if (now < this.blockUntil) return { ok: false, wait: Math.ceil((this.blockUntil - now) / 1000) };
    if (await this.check(pw)) { this.fails = 0; const m = this.mins(); this.until = m ? Date.now() + m * 60000 : Infinity; try { logEvent('lock', 'unlock'); } catch (e) { } return { ok: true }; }
    this.fails++; try { logEvent('lock', 'wrong password #' + this.fails); } catch (e) { }
    if (this.fails >= 5) { const w = Math.min(600, 30 * Math.pow(2, Math.floor(this.fails / 5) - 1)); this.blockUntil = Date.now() + w * 1000; return { ok: false, wait: w }; }
    return { ok: false, left: 5 - this.fails };
  },
  async hashNew(pw) { const salt = crypto.getRandomValues(new Uint8Array(16)), i = 150000; return { s: this.b64(salt), h: this.b64(await this.derive(pw, salt, i)), i }; },
  genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = crypto.getRandomValues(new Uint8Array(16)); let s = ''; for (let i = 0; i < 16; i++) { s += A[b[i] % A.length]; if (i % 4 === 3 && i < 15) s += '-'; } return s; },
  normCode: c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''),
  /* ตั้งรหัสใหม่ → คืนรหัสกู้คืน (แสดงครั้งเดียว) */
  async setPass(pw) {
    const rec = await this.hashNew(pw), code = this.genCode(); rec.rc = await this.hashNew(this.normCode(code)); DB.settings.lock = rec; saveNow(); try { logEvent('lock', 'password changed'); } catch (e) { } return code;
  },
  async resetByCode(code, pw) {
    const r = DB.settings.lock; if (!r || !r.rc) return false; if (!await this.check(this.normCode(code), r.rc)) return false; return this.setPass(pw);
  },
  policy(pw) { return String(pw || '').length >= 6 ? '' : T('รหัสผ่านอย่างน้อย 6 ตัวอักษร (แนะนำ 8 ขึ้นไป ผสมตัวอักษร+ตัวเลข)', 'At least 6 characters (8+ recommended)'); },
  showCode(code) {
    return new Promise(res => modal({
      title: '🔑 ' + T('รหัสกู้คืน (แสดงครั้งเดียว)', 'Recovery code (shown once)'), noClose: true,
      body: `<p class="small" style="margin-top:0">${T('จดหรือบันทึกรหัสนี้ไว้ในที่ปลอดภัย — ใช้ตั้งรหัสผ่านใหม่เมื่อลืมรหัส และจะไม่แสดงอีก', 'Keep this code safe — it lets you reset a forgotten password. It will not be shown again.')}</p><div class="result-big" style="font-size:1.7rem;letter-spacing:.08em;background:var(--lblue);border-radius:14px;padding:14px;user-select:all">${esc(code)}</div>`,

    }));
  }
};

/* =====================================================================
   PromptPay (EMVCo / Thai QR Payment) + หน้า "สนับสนุนผู้พัฒนา"
   ===================================================================== */
function crc16(str) {
  let crc = 0xFFFF;
  for (let k = 0; k < str.length; k++) {
    crc ^= str.charCodeAt(k) << 8;
    for (let i = 0; i < 8; i++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function ppKind(target) {
  const t = String(target || '').replace(/\D/g, '');
  if (t.length === 10 && t[0] === '0') return { kind: '01', acct: '0066' + t.slice(1), type: 'phone', digits: t };
  if (t.length === 13) return { kind: '02', acct: t, type: 'id', digits: t };
  if (t.length === 15) return { kind: '03', acct: t, type: 'ewallet', digits: t };
  return null;
}
function promptPayPayload(target, amount) {
  const k = ppKind(target);
  if (!k) throw new Error('หมายเลข PromptPay ไม่ถูกต้อง (เบอร์มือถือ 10 หลัก / เลขบัตร-ภาษี 13 หลัก / e-Wallet 15 หลัก)');
  const amt = (amount !== null && amount !== undefined && amount !== '' && Number(amount) > 0) ? Number(amount) : null;
  if (amt !== null && (amt < 1 || amt > 9999999)) throw new Error('จำนวนเงินไม่ถูกต้อง');
  const merchant = tlv('00', 'A000000677010111') + tlv(k.kind, k.acct);
  let p = tlv('00', '01') + tlv('01', amt ? '12' : '11') + tlv('29', merchant) + tlv('53', '764') + (amt ? tlv('54', amt.toFixed(2)) : '') + tlv('58', 'TH') + '6304';
  return p + crc16(p);
}
function parsePayload(p) {
  const out = []; let i = 0;
  while (i + 4 <= p.length) { const id = p.slice(i, i + 2), len = parseInt(p.slice(i + 2, i + 4), 10); if (isNaN(len)) break; out.push([id, p.slice(i + 4, i + 4 + len)]); i += 4 + len; }
  return out;
}
function verifyPayload(p) {
  try {
    if (p.length < 20) return false;
    if (crc16(p.slice(0, -4)) !== p.slice(-4)) return false;
    const t = parsePayload(p); const ids = t.map(x => x[0]);
    return ids[0] === '00' && ids.includes('29') && ids.includes('53') && ids.includes('58') && ids[ids.length - 1] === '63';
  } catch (e) { return false; }
}
function qrCanvas(text, px = 320, ecc = 'M', margin = 3) {
  const qr = qrcode(0, ecc); qr.addData(text); qr.make();
  const n = qr.getModuleCount(); const cell = Math.max(2, Math.floor(px / (n + margin * 2))); const size = cell * (n + margin * 2);
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) x.fillRect((q + margin) * cell, (r + margin) * cell, cell, cell);
  return c;
}
const fmtPhone = d => d && d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d;
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; }
  catch (e) { const t = document.createElement('textarea'); t.value = s; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { } t.remove(); return ok; }
}

/* =====================================================================
   Live Room — WebRTC (PeerJS) peer-to-peer ระหว่างครูกับนักเรียน/จอแสดงผล
   ครู = host รหัสห้อง 8 ตัว (ABCD-EFGH)  |  นักเรียน/Display = เปิด ?join=รหัส  หรือ ?display=รหัส
   ===================================================================== */
const peerOpts = () => Object.assign({ debug: 0 }, CONFIG.peer || {});
const Live = {
  active: false, code: null, peer: null, students: new Map(), locked: false, banned: new Map(), known: new Map(), state: { view: 'none', status: 'idle' },
  stream: null, calls: new Map(), lastBoard: null, submissions: [], listeners: new Set(), onAnswer: null, starting: null, mode: 'auto',
  emit() { this.listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } }); if (typeof refreshLiveChip === 'function') refreshLiveChip(); if (typeof DevGate !== 'undefined') DevGate.draw(); },
  sub(f) { this.listeners.add(f); return () => this.listeners.delete(f); },
  joinUrl(kind = 'join') {
    const base = (DB.settings.publicUrl || (location.origin + location.pathname)).split('#')[0].split('?')[0];
    return `${base}?${kind}=${this.code}`;
  },
  async start() {
    if (this.active) return true;
    if (this.starting) return this.starting;
    return this.starting = (async () => {
      try {
        await loadLib('peer');
        for (let attempt = 0; attempt < 8; attempt++) {
          const code = Code.gen();
          try {
            await new Promise((res, rej) => {
              const p = new Peer(Code.pid(code), peerOpts());
              const to = setTimeout(() => { try { p.destroy(); } catch (e) { } rej(new Error('timeout')); }, 12000);
              p.on('open', () => { clearTimeout(to); this.peer = p; this.code = code; res(); });
              p.on('error', e => { clearTimeout(to); try { p.destroy(); } catch (_) { } rej(e); });
            });
            break;
          } catch (e) { if (e.type === 'unavailable-id') continue; throw e; }
        }
        if (!this.peer) throw new Error('ไม่สามารถสร้างห้องได้');
        this.active = true; if (typeof logEvent === 'function') logEvent('live', 'open ' + this.code);
        this.peer.on('connection', c => this._onConn(c));
        this.peer.on('call', c => { const ms = this.students.get(c.peer); if (!ms || ms.role !== 'mirror' || ms.gated) { try { c.close(); } catch (e) { } return; } try { c.answer(); } catch (e) { } c.on('stream', st => { if (typeof Mirror !== 'undefined') Mirror.add(c.peer, st, c); }); c.on('close', () => { if (typeof Mirror !== 'undefined') Mirror.remove(c.peer); }); c.on('error', () => { }); });
        this.peer.on('disconnected', () => { try { this.peer.reconnect(); } catch (e) { } });
        this.peer.on('error', e => { console.warn('peer error', e); });
        this.emit(); keepAwake(); this.syncView();
        return true;
      } catch (e) {
        console.error(e); toast(T('เปิดห้องสดไม่สำเร็จ: ', 'Cannot open live room: ') + (e.message || e.type || ''), 'err', 4500);
        return false;
      } finally { this.starting = null; }
    })();
  },
  stop() {
    this.broadcast({ t: 'closed' });
    this.stopStream(); if (typeof Mirror !== 'undefined') Mirror.clear(); if (typeof CoHost !== 'undefined') CoHost.clear();
    try { this.peer && this.peer.destroy(); } catch (e) { }
    this.peer = null; this.active = false; this.students.clear(); this.locked = false; this.banned.clear(); this.known.clear(); this.code = null; this.state = { view: 'none', status: 'idle' }; this.lastBoard = null; this.mode = 'auto'; this.emit();
  },
  _onConn(conn) {
    /* ด่านแรก: ห้องเต็ม / ถูกบล็อกชั่วคราว → ปฏิเสธทันที */
    if (this.students.size >= (CONFIG.maxConn || 400) || (this.banned.get(conn.peer) || 0) > Date.now()) { conn.on('open', () => { try { conn.send({ t: 'denied', why: 'full' }); } catch (e) { } setTimeout(() => { try { conn.close(); } catch (e) { } }, 250); }); return; }
    const meta = { t0: Date.now(), n: 0, bad: 0 };
    const hto = setTimeout(() => { if (!this.students.has(conn.peer)) { try { conn.close(); } catch (e) { } } }, 20000);   // เชื่อมแล้วไม่ทักทายใน 20 วิ → ตัดทิ้ง (กันกินช่องเชื่อมต่อ)
    conn.on('data', msg => { if (!this._rate(conn, meta)) return; try { this._handle(conn, msg); } catch (e) { console.error(e); } });
    conn.on('close', () => { clearTimeout(hto); const s = this.students.get(conn.peer); if (s && s.conn === conn) { this.students.delete(conn.peer); if (s.role === 'mirror' && typeof Mirror !== 'undefined') Mirror.remove(conn.peer); if (s.role === 'co' && typeof CoHost !== 'undefined') CoHost.remove(conn.peer); if (s.role === 'student') toast(`${s.name} ${T('ออกจากห้อง', 'left')}`, 'ok', 1800); this.emit(); } });
    conn.on('error', () => { });
  },
  /* จำกัดอัตราข้อความ: นักเรียน/อุปกรณ์ที่ยังไม่อนุญาต ≤ 60 ข้อความ/5 วินาที (อุปกรณ์ที่ครูอนุญาตแล้ว เช่น รีโมทเขียนถี่ ไม่ถูกจำกัด) */
  _rate(conn, meta) {
    const now = Date.now(); if (now - meta.t0 > 5000) { meta.t0 = now; meta.n = 0; }
    const s = this.students.get(conn.peer); if (s && s.conn === conn && s.role !== 'student' && !s.gated) return true;
    if (++meta.n <= 60) return true;
    if (++meta.bad > 40) { this.banned.set(conn.peer, now + 60000); try { conn.close(); } catch (e) { } }
    return false;
  },
  kick(s, ban = true) {
    this.send(s.id, { t: 'kick' }); const cid = s.cid;
    if (ban) { this.banned.set(s.id, Date.now() + 600000); if (cid) this.banned.set('c:' + cid, Date.now() + 600000); }
    setTimeout(() => { try { s.conn.close(); } catch (e) { } if (this.students.get(s.id) === s) this.students.delete(s.id); this.emit(); }, 250);
  },
  _submit(s, m) {
    const f = m.file; if (typeof f !== 'string' || f.length > 3e6 || !/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(f)) return;   // รับเฉพาะภาพ base64 (กันสคริปต์/ไฟล์แปลกปลอมที่ถูกใส่ใน HTML ของครู)
    if (this.submissions.length >= 80 || this.submissions.filter(x => x.by === s.id).length >= 5) { toast(`${s.name}: ${T('ส่งงานเกินจำนวนที่กำหนด', 'too many submissions')}`, 'err', 2200); return; }
    this.submissions.unshift({ id: uid('sb_'), by: s.id, name: s.name, file: f, fname: cleanName(m.fname, 80), ts: Date.now() }); this.emit(); toast(`${s.name} ${T('ส่งงานแล้ว', 'submitted work')}`, 'ok');
  },
  /* รับเข้าห้องอย่างเป็นทางการ (หลังผ่านด่านอนุญาตอุปกรณ์แล้ว) */
  _admit(s, m, prev) {
    s.gated = false; try { s.conn.send({ t: 'welcome', name: s.name, state: Object.assign({}, this.state, { ts: Date.now() }), board: this.lastBoard }); } catch (e) { }
    if (this.stream) this._call(s);
    if (s.role === 'display' || s.role === 'remote') { s.imgs = new Set(); if (typeof Cast !== 'undefined') Cast.onJoin(s); if (s.role === 'display' && typeof CoHost !== 'undefined') CoHost.onDisplayJoin(s); }
    if (s.role === 'co') CoHost.onJoin(s);
    if (s.role === 'student') { if (!prev) toast(`${s.name} ${T('เข้าห้องแล้ว', 'joined')}`, 'ok', 1800); if (typeof Teach !== 'undefined') Teach.onHello(s, m); }
    this.emit();
  },
  _handle(conn, m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'hello') {
      const role = ['display', 'remote', 'mirror', 'co'].includes(m.role) ? m.role : 'student';
      const idOf = v => /^[\w-]{8,64}$/.test(String(v || '')) ? String(v) : '';
      const cid = idOf(m.cid), did = idOf(m.did);
      let name = cleanName(m.name) || 'Guest'; const dev = cleanName(m.dev, 30);
      const deny = why => { try { conn.send({ t: 'denied', why }); } catch (e) { } setTimeout(() => { try { conn.close(); } catch (e) { } }, 250); };
      let prev = null;
      if (role === 'student') {
        if (cid && (this.banned.get('c:' + cid) || 0) > Date.now()) return deny('kicked');
        prev = cid ? [...this.students.values()].find(x => x.role === 'student' && x.cid === cid) || null : null;      // กลับเข้าห้องซ้ำ (เน็ตหลุด/รีเฟรช) → คงชื่อ แต้ม ยกมือ เดิม
        if (!prev && this.locked && !(cid && this.known.has(cid))) return deny('locked');   // ล็อกห้อง: คนที่เคยเข้าแล้วหลุด ยังกลับเข้าได้
        if (prev) { name = prev.name; if (prev.conn !== conn) { this.students.delete(prev.id); try { prev.conn.close(); } catch (e) { } } }
        else { const names = new Set([...this.students.values()].filter(s => s.role === 'student').map(s => s.name)); let n = name, i = 2; while (names.has(n)) n = name + ' (' + (i++) + ')'; name = n; }
      } else if (did && (this.banned.get('d:' + did) || 0) > Date.now()) return deny('no');
      const custom = role === 'mirror' ? cleanName(m.name, 30) : '', base = (custom && custom !== 'Mirror') ? custom : (dev || (role === 'display' ? 'Display' : role === 'co' ? 'Device 2' : 'Remote'));
      const s = { id: conn.peer, name: role === 'student' ? name : (dev || 'Device'), role, dev, base, conn, joined: Date.now(), hand: false, handAt: 0, cid, did };
      if (prev) { s.hand = prev.hand; s.handAt = prev.handAt; s.sid = prev.sid; s.joined = prev.joined; }
      if (role !== 'student') { const same = [...this.students.values()].filter(x => x.role !== 'student' && x.base === base).length; s.label = base + (same ? ' ' + (same + 1) : ''); s.name = s.label; }
      /* ด่านอนุญาตอุปกรณ์: จอฉาย/รีโมท/มิเรอร์ ต้องให้ครูกดอนุญาตก่อน (ยกเว้นอุปกรณ์ที่เชื่อถือแล้ว) — บทบาทนี้ผู้เชื่อมเป็นฝ่ายระบุเอง จึงห้ามเข้าได้เองโดยไม่ถามครู */
      const trusted = !!(did && DB.settings.trustDev && DB.settings.trustDev[did]);
      const gate = role !== 'student' && role !== 'co' && DB.settings.devApprove !== false && !trusted;
      if (gate) {
        if ([...this.students.values()].filter(x => x.gated).length >= 4) return deny('busy');
        s.gated = true; this.students.set(conn.peer, s); try { conn.send({ t: 'pending' }); } catch (e) { } this.emit(); return;
      }
      if (role === 'student' && cid) this.known.set(cid, Date.now());
      this.students.set(conn.peer, s); this._admit(s, m, prev); return;
    }
    const s = this.students.get(conn.peer); if (!s || s.conn !== conn) return;
    if (s.role !== 'student') { if (s.gated) return; if (typeof Devices !== 'undefined') Devices.onMsg(s, m); return; }
    if (m.t === 'answer' && this.onAnswer) { if (typeof Teach !== 'undefined') Teach.ev('ans', s); this.onAnswer(s, m); }
    else if (m.t === 'ck') { if (typeof Teach !== 'undefined') Teach.onCk(s, m); }
    else if (m.t === 'hand') { if (m.on && !s.hand && typeof Teach !== 'undefined') Teach.ev('hand', s); s.hand = !!m.on; s.handAt = Date.now(); this.emit(); }
    else if (m.t === 'submit') this._submit(s, m);
    else if (m.t === 'cast') {   /* นักเรียนขอรับสไลด์สดแบบเวกเตอร์ (ลายเส้นสด/เลเซอร์/ซูมตามครู) — ok = วาดหน้าแรกได้แล้ว จึงหยุดส่งภาพนิ่งให้คนนี้ */
      if (m.on === false) { s.cast = false; s.castOk = false; } else if (m.on) { if (!s.cast) { s.cast = true; s.imgs = new Set(); s.castOk = false; if (typeof Cast !== 'undefined') Cast.onJoin(s); } }
      if (m.ok && s.cast) s.castOk = true;
    }
    else if (m.t === 'note') { /* reserved */ }
  },
  send(id, msg) { const s = this.students.get(id); if (s && !s.gated && s.conn.open) { try { s.conn.send(msg); } catch (e) { } } },

  place(cx, cy, n, W, H) {

/* =====================================================================
   Teach — คาบเรียน · เช็คชื่อ · สรุปหลังจบคาบ

   - ระหว่างคาบเก็บข้อมูล: เวลา, หน้าสไลด์ที่สอน, การเขียน, เครื่องมือที่ใช้, ยกมือ, ตอบคำถาม, ถูกสุ่ม, XP
   - จบคาบ → สรุป + บันทึกเข้า DB.teach (ดูย้อนหลังที่หน้า “ห้องเรียน” แท็บ “คาบเรียน”) + ส่งออก CSV
   ===================================================================== */
const ATT = { p: ['มา', 'ok'], t: ['สาย', 'warn'], l: ['ลา', 'pk'], a: ['ขาด', 'bad'] };

const fmtDur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + ' ชม. ' + (m % 60) + ' นาที' : m + ' นาที'; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const TOOL_NAMES = { timer: 'จับเวลา', pick: 'สุ่มชื่อ', poll: 'ถามด่วน/โพล', pages: 'จัดการหน้า', style: 'เครื่องมือเขียน', pad: 'iPad ควบคุม', mirrors: 'Screen Mirroring', share: 'แชร์หน้าจอ', quiz: 'แบบทดสอบสด', co: 'เครื่องนำเสนอที่ 2', tiles: 'ไทล์', display: 'จอฉาย' };

const Teach = {
  subs: new Set(),
  sub(f) { this.subs.add(f); return () => this.subs.delete(f); },
  emit() { this.subs.forEach(f => { try { f(); } catch (e) { } }); try { if (Live.active) Devices.pushAtt(); } catch (e) { } },

  get cur() { return DB.teachCur; },

  /* ---------- เริ่ม / จบ ---------- */
  start({ classId, topic, mode, lateMin }) {

    const st = this.set(); mode = mode || st.mode; lateMin = lateMin == null ? st.lateMin : lateMin; Object.assign(st, { mode, lateMin });
    const pts0 = {}; cc.students.forEach(s => { pts0[s.id] = DB.points[s.name] || 0; });
    const t = DB.teachCur = { id: uid('tc_'), classId, className: cc.name, subject: cc.subject || '', level: cc.level || '', topic: (topic || '').trim(), start: Date.now(), end: 0, date: today(), mode, lateMin, open: mode !== 'off', att: {}, ck: {}, tok: {}, ev: { hand: {}, ans: {}, pick: {} }, pages: {}, docs: {}, ink: 0, tools: {}, peak: 0, peakDev: 0, guests: {}, pts0, log: [], _w: {} };
    DB.curClass = classId; this.log('start', 'เริ่มคาบ ' + cc.name); try { const d = Hub.api && Hub.api.doc && Hub.api.doc(); if (d) this.page(d, d.cur); } catch (e) { } save(); this.noteOnline(); this.pushState(); this.emit(); return t;
  },
  end({ absentRest = true } = {}) {

    t.end = Date.now(); this.log('end', 'จบคาบ'); this.sync();
    const rec = JSON.parse(JSON.stringify(t)); delete rec.tok; delete rec._w; delete rec.pts0;
    rec.roster = cc ? cc.students.map(s => ({ id: s.id, no: s.no, name: s.name })) : [];
    rec.guests = Object.keys(t.guests || {}); rec.xp = {}; if (cc) cc.students.forEach(s => { rec.xp[s.id] = (DB.points[s.name] || 0) - (t.pts0[s.id] || 0); });
    rec.quiz = this.quizzesIn(t, rec.roster);

  },
  cancel() { if (!this.cur) return; DB.teachCur = null; save(); try { if (Live.active) Live.setState({ ck: null }); } catch (e) { } this.emit(); },
  quizzesIn(t, roster) {

    (DB.sessions || []).filter(s => s.date >= t.start - 5000 && s.date <= Date.now() + 5000).forEach(s => {
      const mx = typeof sessMax === 'function' ? sessMax(s) : 0; const per = {};

  },

  /* ---------- เช็คชื่อ ---------- */
  sync() {
    const t = this.cur, cc = this.cls(); if (!t || !cc) return;

  },
  setStatus(sid, v) {

    if (!v) { delete t.att[sid]; delete t.ck[sid]; } else { t.att[sid] = v; if (['p', 't'].includes(v) && !t.ck[sid]) t.ck[sid] = { ts: Date.now(), via: 'manual' }; if (['a', 'l'].includes(v)) delete t.ck[sid]; }

  },
  markAll(v, onlyEmpty) { const t = this.cur, cc = this.cls(); if (!t || !cc) return; cc.students.forEach(s => { if (!onlyEmpty || !t.att[s.id]) { t.att[s.id] = v; if (v === 'p' && !t.ck[s.id]) t.ck[s.id] = { ts: Date.now(), via: 'manual' }; } }); this.sync(); save(); this.pushState(); this.emit(); },
  setOpen(on) { const t = this.cur; if (!t) return; t.open = !!on; if (on && t.mode === 'off') t.mode = this.set().mode === 'off' ? 'pick' : this.set().mode; this.log('open', on ? 'เปิดรับเช็คชื่อ' : 'ปิดรับเช็คชื่อ'); save(); this.pushState(); this.emit(); },
  setMode(m) { const t = this.cur; if (!t) return; t.mode = m; t.open = m !== 'off'; this.set().mode = m; save(); this.pushState(); this.emit(); },
  _ps: 0,
  pushState() {

      if (!Live.active) return; const t = this.cur, cc = this.cls();
      if (!t || !cc || !t.open || t.mode === 'off') { if (Live.state.ck) Live.setState({ ck: null }); return; }
      const list = t.mode === 'pick' ? cc.students.filter(s => !this.claimed(s)).map(s => ({ id: s.id, no: s.no, name: s.name })) : [];
      Live.setState({ ck: { tc: t.id, mode: t.mode, cls: t.className, n: cc.students.length, left: cc.students.filter(s => !this.claimed(s)).length, list } });
    }, 120);
  },
  claim(s, st, via) {
    const t = this.cur; if (!t) return; const late = (Date.now() - t.start) / 60000 > t.lateMin; const status = late ? 't' : 'p'; delete t.guests[s.name];
    t.att[st.id] = status; t.ck[st.id] = { ts: Date.now(), via }; const tok = uid('k_'); t.tok[st.id] = tok; s.sid = st.id; s.name = st.name;
    this.sync(); this.log('ck', st.name + (late ? ' (สาย)' : '')); save();

  },
  onHello(s, m) {

    const ck = m && m.ck; if (ck && ck.sid && t.tok[ck.sid] && t.tok[ck.sid] === ck.tok) { const st = this.stu(ck.sid); if (st) { s.sid = st.id; s.name = st.name; Live.send(s.id, { t: 'ckr', ok: true, again: true, name: st.name, no: st.no, tok: ck.tok, sid: st.id, status: t.att[st.id], tc: t.id }); Live.emit(); return; } }
    if (t.open) { const nm = normName(s.name); const st = cc.students.find(x => !this.claimed(x) && (normName(x.name) === nm || (x.nick && normName(x.nick) === nm))); if (st) this.claim(s, st, 'auto'); }
  },
  onCk(s, m) {
    const t = this.cur, cc = this.cls(); const no = msg => Live.send(s.id, { t: 'ckr', ok: false, msg });
    if (!t || !cc || !t.open) return no('ครูปิดรับเช็คชื่อแล้ว');
    if (s.sid) return no('คุณเช็คชื่อแล้ว');
    let st = null;
    if (m.sid) st = cc.students.find(x => x.id === m.sid);
    else if (m.no != null && String(m.no).trim() !== '') { const c = cc.students.filter(x => String(x.no) === String(m.no).trim()); if (c.length === 1) st = c[0]; }
    if (!st) return no('ไม่พบเลขที่นี้ในห้อง');
    if (this.claimed(st)) return no('ชื่อนี้เช็คชื่อแล้ว — ถ้าไม่ใช่คุณ แจ้งครูได้เลย');

  link(peerId, sid) { const s = Live.students.get(peerId), st = this.stu(sid); if (!s || !st) return; if (this.claimed(st)) { const ex = Live.list().find(x => x.sid === st.id && x !== s); if (ex) { delete ex.sid; } } this.claim(s, st, 'link'); },
  guests() { const t = this.cur, cc = this.cls(); if (!t || !cc) return []; return Live.list().filter(s => !s.sid); },
  noteOnline() { const t = this.cur; if (!t) return; const n = Live.active ? Live.list().length : 0; if (n > t.peak) t.peak = n; const d = Live.active ? Live.list('display').length + Live.list('remote').length : 0; if (d > t.peakDev) t.peakDev = d; },

  /* ---------- เก็บข้อมูลการสอน ---------- */
  sidOf(s) { if (s.sid) return s.sid; const cc = this.cls(); if (!cc) return null; const nm = normName(s.name); const st = cc.students.find(x => normName(x.name) === nm); return st ? st.id : null; },
  ev(kind, s) { const t = this.cur; if (!t) return; const sid = this.sidOf(s); if (!sid) return; t.ev[kind][sid] = (t.ev[kind][sid] || 0) + 1; this.emitSoon(); save(); },
  evId(kind, sid) { const t = this.cur; if (!t || !sid) return; t.ev[kind][sid] = (t.ev[kind][sid] || 0) + 1; this.emitSoon(); save(); },
  tool(id, label) { const t = this.cur; if (!t || id === 'att') return; t.tools[id] = (t.tools[id] || 0) + 1; this.log('tool', label || TOOL_NAMES[id] || id); save(); },
  page(doc, i) { const t = this.cur; if (!t || !doc || !doc.pages[i]) return; t.docs[doc.id] = { name: doc.name, total: doc.pages.length }; const k = doc.id + ':' + doc.pages[i].id; if (!t.pages[k]) { t.pages[k] = Date.now(); } },
  inkTick() { const t = this.cur; if (t) t.ink++; },

  /* ---------- คำนวณรายงาน ---------- */
  calc(rec) {
    const R = rec.roster || []; const c = { p: 0, t: 0, l: 0, a: 0, none: 0 };
    const rows = R.map(r => {
      const st = rec.att[r.id] || ''; if (st) c[st]++; else c.none++;
      const hand = rec.ev.hand[r.id] || 0, ans = rec.ev.ans[r.id] || 0, pick = rec.ev.pick[r.id] || 0, xp = (rec.xp || {})[r.id] || 0;
      let qp = 0, qm = 0; (rec.quiz || []).forEach(q => { if (q.per[r.id]) { qp += q.per[r.id].pts; qm += q.max || 0; } });
      const ck = rec.ck[r.id];
      return { id: r.id, no: r.no, name: r.name, st, ckTs: ck ? ck.ts : 0, via: ck ? ck.via : '', hand, ans, pick, xp, qp, qm, score: hand + ans + pick };
    });
    const here = c.p + c.t, total = R.length;
    const pages = Object.keys(rec.pages || {}).length; const totalPages = Object.values(rec.docs || {}).reduce((a, d) => a + d.total, 0);
    const act = rows.filter(r => ['p', 't'].includes(r.st));
    const top = act.filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);
    const quiet = act.filter(r => r.score === 0);
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    return {
      c, total, here, rate: total ? Math.round(here / total * 100) : 0, rows, top, quiet, pages, totalPages,
      hands: sum('hand'), answers: sum('ans'), picks: sum('pick'), xp: rows.reduce((a, r) => a + Math.max(0, r.xp), 0),
      partN: act.filter(r => r.score > 0).length, partRate: here ? Math.round(act.filter(r => r.score > 0).length / here * 100) : 0,
      dur: (rec.end || Date.now()) - rec.start, tools: Object.entries(rec.tools || {}).sort((a, b) => b[1] - a[1])
    };
  },

  text(rec) {

      ab.length ? 'ขาด: ' + ab.join(', ') : '', la.length ? 'สาย: ' + la.join(', ') : '', `การมีส่วนร่วม: ยกมือ ${k.hands} · ตอบคำถาม ${k.answers} · ถูกสุ่ม ${k.picks} (มีส่วนร่วม ${k.partN}/${k.here} คน)`, k.top.length ? 'เด่น: ' + k.top.map(r => r.name + ' (' + r.score + ')').join(', ') : '',

  /* ---------- หน้าต่าง “เช็คชื่อ” ใน Studio ---------- */
  win() {
    return Win.toggle('att', {
      title: '📋 ' + T('เช็คชื่อ / คาบเรียน', 'Attendance'), w: 470, h: 600,
      build: (b) => { b._sig = ''; b.classList.add('att-win'); Teach.bind(b); Teach.view(b, true); },
      update: (b) => Teach.view(b)
    });
  },
  bind(b) {
    b.addEventListener('click', e => {
      const x = e.target.closest('[data-a]'); if (!x) return; const a = x.dataset.a, t = this.cur;
      if (a === 'start') { const cl = $('#atC', b).value; if (!cl) return toast(T('เลือกห้องก่อน', 'Pick a class'), 'err'); const tp = $('#atT', b).value; this.start({ classId: cl, topic: tp, mode: $('#atM', b).value, lateMin: +$('#atL', b).value }); b._sig = ''; this.view(b, true); }
      else if (a === 'st') { const cur = t && t.att[x.dataset.s]; this.setStatus(x.dataset.s, cur === x.dataset.k ? '' : x.dataset.k); }
      else if (a === 'allp') this.markAll('p', true);
      else if (a === 'open') this.setOpen(!t.open);
      else if (a === 'end') this.endFlow();
      else if (a === 'cancel') confirmBox(T('ยกเลิกคาบนี้ (ไม่บันทึกสรุป)?', 'Discard this session?')).then(ok => { if (ok) { this.cancel(); b._sig = ''; this.view(b, true); } });
      else if (a === 'newcls') go('classes');
      else if (a === 'kick') { const s = Live.students.get(x.dataset.p); if (s) Live.send(s.id, { t: 'ckr', ok: false, msg: 'ครูให้เช็คชื่อใหม่' }); }
    });
    b.addEventListener('change', e => {
      const x = e.target.closest('[data-a]'); if (!x) return; const a = x.dataset.a;
      if (a === 'mode') this.setMode(x.value);
      else if (a === 'link' && x.value) { this.link(x.dataset.p, x.value); }
      else if (a === 'late') { this.cur.lateMin = +x.value; this.set().lateMin = +x.value; save(); }
    });
    b.addEventListener('input', e => { if (e.target.id === 'atQ') { b._q = e.target.value.trim().toLowerCase(); b._sig = ''; this.view(b, false, true); } });
  },
  view(b, force, keepFocus) {

    const el = $('#atEl', b); if (el) el.textContent = '⏱ ' + fmtClock(Date.now() - t.start);
    const gs = this.guests(); const sig = ['run', t.id, t.open, t.mode, t.lateMin, JSON.stringify(t.att), Object.keys(t.ck).length, gs.map(g => g.id + g.name).join(','), b._q || '', cc ? cc.students.length : 0, Live.active].join('|');
    if (!force && b._sig === sig) return; b._sig = sig; this.viewRun(b, t, cc, keepFocus);
  },
  viewStart(b) {

  },

  /* ---------- จบคาบ ---------- */
  endFlow() {
    const t = this.cur, cc = this.cls(); if (!t) return; const none = cc ? cc.students.filter(s => !t.att[s.id]).length : 0;

      title: T('จบคาบเรียน', 'End session'), body: `<p style="margin-top:0">${esc(t.className)} · ${fmtDur(Date.now() - t.start)}</p>${none ? `<label class="row" style="gap:8px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="atAb" ${this.set().autoAbsent ? 'checked' : ''} style="margin-top:4px"><span>${T(`นักเรียนที่ยังไม่ได้เช็คชื่อ ${none} คน ให้นับเป็น “ขาด”`, `Mark ${none} unchecked students as absent`)}</span></label>` : `<p class="muted small">${T('เช็คชื่อครบทุกคนแล้ว', 'Everyone has a status')}</p>`}`,
      actions: [{ label: T('กลับไปสอนต่อ', 'Keep teaching') }, {

        }
      }]
    });
  },

        <div class="card"><h4 style="margin:0 0 8px">${T('ไทม์ไลน์', 'Timeline')}</h4><div class="tl">${(rec.log || []).filter(l => l.type !== 'ck').slice(-14).map(l => `<div class="tiny"><b>${new Date(l.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</b> ${esc(l.text)}</div>`).join('') || '—'}</div></div></div>
      <div class="card" style="margin-top:12px"><h4 style="margin:0 0 8px">${T('รายบุคคล', 'Per student')}</h4><div class="tw" style="max-height:340px;overflow:auto"><table class="t"><thead><tr><th>${T('เลขที่', 'No.')}</th><th>${T('ชื่อ', 'Name')}</th><th>${T('สถานะ', 'Status')}</th><th>${T('เวลาเช็ค', 'In')}</th><th>✋</th><th>${T('ตอบ', 'Ans')}</th><th>🎯</th><th>${T('ส่วนร่วม', 'Part.')}</th><th>XP</th></tr></thead><tbody>${k.rows.map(r => `<tr><td>${r.no ?? ''}</td><td>${esc(r.name)}</td><td><span class="chip ${(ATT[r.st] || [0, ''])[1]}">${attMark(r.st)}</span></td><td class="tiny">${r.ckTs ? new Date(r.ckTs).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' ' + (via[r.via] || '') : ''}</td><td>${r.hand || ''}</td><td>${r.ans || ''}</td><td>${r.pick || ''}</td><td style="min-width:90px">${r.score ? `<div class="row" style="gap:6px"><div style="flex:1">${bar(r.score, maxS)}</div><b>${r.score}</b></div>` : ''}</td><td>${r.xp ? '+' + r.xp : ''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  },
  showSummary(rec, fresh) {
    const el = document.createElement('div'); el.innerHTML = this.html(rec);
    modal({
      title: '📊 ' + (fresh ? T('สรุปหลังจบคาบ', 'Session summary') : T('สรุปคาบเรียน', 'Session summary')), wide: true, body: el,
      actions: [{ label: T('ปิด', 'Close') }, { label: '📋 ' + T('คัดลอกสรุป', 'Copy'), keep: true, onClick: async () => { const ok = await copyText(this.text(rec)); toast(ok ? T('คัดลอกสรุปแล้ว (วางใน LINE/เอกสารได้)', 'Copied') : T('คัดลอกไม่สำเร็จ', 'Copy failed'), ok ? 'ok' : 'err'); } },
        { label: '🖨 ' + T('พิมพ์/PDF', 'Print'), keep: true, onClick: () => this.print(rec) }, { label: '⬇ CSV', cls: 'pri', keep: true, onClick: () => downloadBlob(`${rec.className}-${rec.date}-${T('สรุปคาบ', 'session')}.csv`, this.csv(rec), 'text/csv') }]
    });
  },
  print(rec) {
    const w = window.open('', '_blank'); if (!w) return toast(T('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ — อนุญาต pop-up หรือใช้ CSV', 'Pop-up blocked'), 'err', 4000);
    const css = 'body{font-family:"Noto Sans Thai",sans-serif;color:#142B4A;padding:18px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd6e6;padding:4px 8px;font-size:12px;text-align:left}.card{border:1px solid #ccd6e6;border-radius:10px;padding:10px;margin:8px 0}.grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.chip{border:1px solid #ccd6e6;border-radius:99px;padding:0 8px;font-size:11px}.pbar{height:8px;background:#e8eef7;border-radius:6px}.pbar i{display:block;height:100%;background:#142B4A;border-radius:6px}.ico{display:none}.sp{flex:1}.row{display:flex;align-items:center}.pb{display:flex;gap:8px;align-items:center}.lab{width:50px}.muted{color:#5b6e8c}h3,h4{margin:4px 0}';
    w.document.write(`<html><head><meta charset="utf-8"><title>${esc(rec.className)} ${rec.date}</title><style>${css}</style></head><body>${this.html(rec)}<script>setTimeout(()=>print(),400)<\/script></body></html>`); w.document.close();
  },

  /* ---------- ประวัติคาบ (แท็บในหน้าห้องเรียน) ---------- */
  history(b, cc, goAtt) {
    const L = DB.teach.filter(x => x.classId === cc.id);

      // รายคน: มาเรียน % + ส่วนร่วมรวม ตลอดทุกคาบ
      const per = cc.students.map(s => { let here = 0, tot = 0, sc = 0; rows.forEach(x => { const q = x.k.rows.find(y => y.id === s.id); if (q) { if (q.st) { tot++; if (['p', 't'].includes(q.st)) here++; } sc += q.score; } }); return { s, here, tot, sc, pct: tot ? Math.round(here / tot * 100) : null }; });
      b.innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">${T('คาบเรียนที่สอนแล้ว', 'Sessions')} <span class="chip">${rows.length}</span></h3><span class="sp"></span>${Teach.on() && Teach.cur.classId === cc.id ? `<span class="chip ok">● ${T('กำลังสอนคาบนี้', 'In session')}</span>` : `<button class="btn sm pri" id="hStart">▶ ${T('เริ่มคาบ', 'Start session')}</button>`}${rows.length ? `<button class="btn sm" id="hCsv">${ic('down', 14)} CSV ${T('ทุกคาบ', 'all')}</button>` : ''}</div>
        ${rows.length ? `<div class="small muted" style="margin:6px 0">${T('เข้าเรียนเฉลี่ย', 'Avg attendance')} <b>${avgRate}%</b></div><div class="tw"><table class="t"><thead><tr><th>${T('วันที่', 'Date')}</th><th>${T('หัวข้อ', 'Topic')}</th><th>${T('เวลา', 'Time')}</th><th>${T('เข้าเรียน', 'Attended')}</th><th>${T('ส่วนร่วม', 'Particip.')}</th><th style="width:130px"></th></tr></thead><tbody>${rows.map(({ r, k }) => `<tr><td>${fmtD(r.start)}</td><td>${esc(r.topic || '—')}</td><td class="tiny">${fmtDur(k.dur)}</td><td><span class="chip ${k.rate >= 80 ? 'ok' : k.rate >= 60 ? 'warn' : 'bad'}">${k.here}/${k.total} · ${k.rate}%</span></td><td class="tiny">✋${k.hands} · 💬${k.answers} · 🎯${k.picks}</td><td style="text-align:right"><button class="btn sm" data-v="${r.id}">${T('ดูสรุป', 'View')}</button> <button class="btn sm icon danger" data-x="${r.id}">${ic('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty" style="padding:24px">${T('ยังไม่มีคาบเรียน — กด “เริ่มคาบ” (หรือที่ Studio กดปุ่ม “เช็คชื่อ”) แล้วจบคาบเพื่อดูสรุป', 'No sessions yet')}</div>`}</div>
        ${rows.length ? `<div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px">${T('สรุปรายคนตลอดทุกคาบ', 'Per student over all sessions')}</h3><div class="tw" style="max-height:360px;overflow:auto"><table class="t"><thead><tr><th>${T('เลขที่', 'No.')}</th><th>${T('ชื่อ', 'Name')}</th><th>${T('มาเรียน', 'Attended')}</th><th>${T('ส่วนร่วมสะสม', 'Participation')}</th></tr></thead><tbody>${per.map(p => `<tr><td>${p.s.no ?? ''}</td><td>${esc(p.s.name)}</td><td>${p.pct === null ? '—' : `<span class="chip ${p.pct >= 80 ? 'ok' : p.pct >= 60 ? 'warn' : 'bad'}">${p.here}/${p.tot} · ${p.pct}%</span>`}</td><td>${p.sc || ''}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
      const hs = $('#hStart', b); if (hs) hs.onclick = () => goAtt && goAtt();
      $$('[data-v]', b).forEach(x => x.onclick = () => { const r = L.find(y => y.id === x.dataset.v); if (r) this.showSummary(r); });
      $$('[data-x]', b).forEach(x => x.onclick = async () => { if (await confirmBox(T('ลบบันทึกคาบนี้? (ข้อมูลเช็คชื่อรายวันไม่ถูกลบ)', 'Delete this record?'))) { DB.teach = DB.teach.filter(y => y.id !== x.dataset.x); const i = L.findIndex(y => y.id === x.dataset.x); if (i >= 0) L.splice(i, 1); save(); draw(); } });
      const hc = $('#hCsv', b); if (hc) hc.onclick = () => { const head = ['วันที่', 'หัวข้อ', 'ระยะเวลา(นาที)', 'มา', 'สาย', 'ลา', 'ขาด', 'เข้าเรียน%', 'ยกมือ', 'ตอบ', 'ถูกสุ่ม', 'หน้าที่สอน']; downloadBlob(`${cc.name}-sessions.csv`, toCSV([head, ...rows.slice().reverse().map(({ r, k }) => [fmtD(r.start), r.topic, Math.round(k.dur / 60000), k.c.p, k.c.t, k.c.l, k.c.a, k.rate, k.hands, k.answers, k.picks, k.pages])]), 'text/csv'); };
    };
    draw();
  },
  init() { Live.sub(() => { const t = Teach.cur; if (t) { Teach.noteOnline(); Live.list().forEach(s => { if (!s.sid && s.name) t.guests[s.name] = t.guests[s.name] || Date.now(); }); } }); }
};
Teach.init();

/* =====================================================================
   Dock — แถบฟีเจอร์ที่กำลังใช้งาน มุมขวาบนของ Teaching Studio
   เมื่อเปิดใช้ จับเวลา / เช็คชื่อ / ถามด่วน / ผลสุ่มชื่อ → การ์ดเล็กโผล่ขึ้นมุมขวาบนทันที
   ย่อเหลือชิป (–) · ขยายใหญ่ (⤢) · ปรับเพิ่มลดเวลา (−1 / +1 / +5) · ปิด (×) — จำสถานะย่อ/ขยายของแต่ละการ์ดไว้
   ===================================================================== */
const Dock = {
  el: null, stage: null, iv: 0, sig: '',
  st() { const s = DB.settings; if (!s.dock) s.dock = { min: {}, big: {} }; s.dock.min = s.dock.min || {}; s.dock.big = s.dock.big || {}; return s.dock; },
  mount(stage) {
    this.unmount(); this.stage = stage; const el = this.el = document.createElement('div'); el.className = 'dock'; stage.appendChild(el);
    el.onclick = e => this.click(e); this.iv = setInterval(() => this.tick(), 350); this.sig = ''; this.tick(true);
  },
  unmount() { clearInterval(this.iv); this.iv = 0; if (this.el) this.el.remove(); this.el = null; this.stage = null; },
  list() {
    const w = Hub.w || {}, out = []; if (w.timer && !Pop.shown('timer')) out.push('timer'); if (Teach.on()) out.push('att'); if (Hub.poll && !Pop.shown('poll')) out.push('poll'); if (w.pick && !Pop.shown('pick')) out.push('pick'); return out;
  },
  cnt() {
    const t = Teach.cur, cc = Teach.cls(), c = { p: 0, t: 0, l: 0, a: 0, n: 0, tot: 0 }; if (!t || !cc) return c; c.tot = cc.students.length; cc.students.forEach(s => { const k = t.att[s.id]; if (k && c[k] != null) c[k]++; else c.n++; }); return c;
  },
  tl(t) { return t.paused ? t.left : (t.end - Date.now()) / 1000; },
  html(id, S) {
    const min = !!S.min[id], big = !!S.big[id], w = Hub.w || {};
    const head = (ico, title, val, ex) => `<div class="dk-h"><span class="dk-t">${ico} <b>${esc(title)}</b></span><span class="dk-v" data-v>${val || ''}</span><button class="dk-x" data-d="min" title="${min ? T('ขยายกลับ', 'Restore') : T('ย่อ', 'Minimize')}">${min ? '▢' : '–'}</button><button class="dk-x" data-d="big" title="${big ? T('ขนาดปกติ', 'Normal') : T('ขยายใหญ่', 'Enlarge')}">${big ? '⤡' : '⤢'}</button>${ex || ''}</div>`;
    const wrap = (cls, inner) => `<div class="dk ${cls} ${min ? 'min' : ''} ${big ? 'big' : ''}" data-id="${id}">${inner}</div>`;
    if (id === 'timer') {
      const t = w.timer; if (!t) return '';
      return wrap('dk-timer', head('⏱', T('จับเวลา', 'Timer'), fmtMS(this.tl(t)), `<button class="dk-x" data-d="tx" title="${T('ยกเลิก', 'Cancel')}">×</button>`) +
        `<div class="dk-b"><div class="dk-n" data-n>--:--</div><div class="pbar"><i data-b></i></div><div class="dk-c"><button data-d="t-1">−1</button><button data-d="t+1">+1</button><button data-d="t+5">+5</button><button data-d="tp" data-pp>⏯</button></div></div>`);
    }
    if (id === 'att') {
      const t = Teach.cur, c = this.cnt(); const here = c.p + c.t;
      const un = big ? (Teach.cls().students.filter(s => !t.att[s.id]).slice(0, 10)) : [];
      return wrap('dk-att', head('📋', t.className, here + '/' + c.tot) +
        `<div class="dk-b"><div class="att-cnt" style="margin:0 0 8px"><span class="chip ok">${T('มา', 'P')} ${c.p}</span><span class="chip warn">${T('สาย', 'L')} ${c.t}</span><span class="chip pk">${T('ลา', 'E')} ${c.l}</span><span class="chip bad">${T('ขาด', 'A')} ${c.a}</span><span class="chip">${T('ยังไม่เช็ค', 'Open')} ${c.n}</span></div>
          <div class="dk-c"><button data-d="aopen" class="${t.open ? 'on' : ''}">${t.open ? '🔓 ' + T('เปิดรับ', 'Open') : '🔒 ' + T('ปิดรับ', 'Closed')}</button><button data-d="aall">${T('ที่เหลือ=มา', 'Rest present')}</button><button data-d="awin">${T('รายชื่อ', 'List')}</button></div>
          ${un.length ? `<div class="dk-l">${un.map(s => `<div class="dk-r" data-sid="${esc(s.id)}"><span>${esc(s.no)}. ${esc(s.name)}</span><button data-d="as-p">${T('มา', 'P')}</button><button data-d="as-a">${T('ขาด', 'A')}</button></div>`).join('')}${c.n > un.length ? `<div class="tiny muted" style="text-align:center">+${c.n - un.length}</div>` : ''}</div>` : ''}</div>`);
    }
    if (id === 'poll') {
      const p = Hub.poll; if (!p) return ''; const mx = Math.max(1, ...p.counts);
      return wrap('dk-poll', head('❓', T('ถามด่วน', 'Quick poll'), p.n + '/' + Live.list().length, `<button class="dk-x" data-d="px" title="${T('จบ', 'End')}">×</button>`) +
        `<div class="dk-b">${p.labels.map((l, i) => `<div class="hp-r"><span class="hp-l">${esc(l)}</span><div class="hp-b"><i style="width:${p.counts[i] / mx * 100}%"></i></div><b>${p.counts[i]}</b></div>`).join('')}<div class="dk-c"><button data-d="pc" ${p.open ? '' : 'disabled'}>${T('ปิดรับ', 'Close')}</button><button data-d="ps" class="${p.show ? 'on' : ''}">${p.show ? T('ซ่อนบนจอ', 'Hide') : T('โชว์บนจอ', 'Show')}</button></div></div>`);
    }
    if (id === 'pick') {
      const p = w.pick; if (!p) return '';
      return wrap('dk-pick', head('🎯', T('ผู้ถูกสุ่ม', 'Picked'), esc(p.name), `<button class="dk-x" data-d="kx" title="${T('ล้างจอ', 'Clear')}">×</button>`) +
        `<div class="dk-b"><div class="dk-nm">${esc(p.name)}</div><div class="dk-c"><button data-d="kgo">🎲 ${T('สุ่มใหม่', 'Again')}</button><button data-d="kx">${T('ล้างจอ', 'Clear')}</button></div></div>`);
    }
    return '';
  },
  tick(force) {
    if (!this.el) return; const S = this.st(), ids = this.list(), w = Hub.w || {};
    const c = this.cnt(), t = Teach.cur, p = Hub.poll;
    const sig = ids.map(id => id + (S.min[id] ? 'm' : '') + (S.big[id] ? 'b' : '')).join() + '|' + (w.timer ? (w.timer.paused ? 'P' : 'R') + w.timer.total : '') + '|' + (t ? [c.p, c.t, c.l, c.a, c.n, t.open, t.className].join() : '') + '|' + (p ? p.counts.join() + p.n + p.show + p.open : '') + '|' + (w.pick ? w.pick.name : '');
    if (force || sig !== this.sig) { this.sig = sig; this.el.innerHTML = ids.map(id => { try { return this.html(id, S); } catch (e) { return ''; } }).join(''); this.el.classList.toggle('empty', !ids.length); }
    const tm = w.timer, card = this.el.querySelector('.dk-timer');
    if (tm && card) {
      const l = this.tl(tm), n = card.querySelector('[data-n]'), v = card.querySelector('[data-v]'), b = card.querySelector('[data-b]'), txt = fmtMS(l);
      if (n) n.textContent = l <= 0 ? T('หมดเวลา!', "Time's up!") : txt; if (v) v.textContent = l <= 0 ? '⏰' : txt; if (b) b.style.width = Math.max(0, Math.min(100, l / (tm.total || 1) * 100)) + '%';
      card.classList.toggle('low', l <= 10 && l > 0); card.classList.toggle('done', l <= 0); card.classList.toggle('pause', !!tm.paused);
    }
    const hc = this.stage && this.stage.querySelector('.hub'); if (hc) hc.classList.toggle('dk-shift', false);
  },
  click(e) {
    const b = e.target.closest('[data-d]'); if (!b) return; const card = b.closest('.dk'), id = card && card.dataset.id, d = b.dataset.d, S = this.st(); if (b.disabled) return;
    if (d === 'big' && id === 'timer') Hub.timerBig(true); else if (d === 'min') { S.min[id] = !S.min[id]; save(); } else if (d === 'big') { S.big[id] = !S.big[id]; if (S.big[id]) S.min[id] = false; save(); }
    else if (d === 'tx') { Hub.w = Object.assign({}, Hub.w, { timer: null }); Hub.push(); Hub.draw(); }
    else if (d === 't-1') Hub.timerAdd(-60); else if (d === 't+1') Hub.timerAdd(60); else if (d === 't+5') Hub.timerAdd(300); else if (d === 'tp') Hub.timerPause();
    else if (d === 'aopen') Teach.setOpen(!(Teach.cur && Teach.cur.open)); else if (d === 'aall') Teach.markAll('p', true); else if (d === 'awin') Win.attend();
    else if (d === 'as-p' || d === 'as-a') { const r = b.closest('[data-sid]'); if (r) Teach.setStatus(r.dataset.sid, d === 'as-p' ? 'p' : 'a'); }
    else if (d === 'pc') Hub.pollAct('close'); else if (d === 'ps') Hub.pollAct('show'); else if (d === 'px') Hub.pollAct('end');
    else if (d === 'kgo') Hub.pick(); else if (d === 'kx') { Hub.w = Object.assign({}, Hub.w, { pick: null }); Hub.push(); }
    this.tick(true);
  }
};

/* =====================================================================
   Pop — ป๊อปอัปแสดงผลฟีเจอร์ที่มีผลลัพธ์ (จับเวลา · สุ่มชื่อ · ถามด่วน · กลุ่ม) ใช้ร่วมกันใน Studio และ iPad/รีโมท
   เริ่มจากอุปกรณ์ไหนก็ตาม (วงกลมเมนู · หน้าต่าง · iPad · ปุ่มลัด) → ป๊อปอัปขึ้นที่ทุกเครื่องที่ครูใช้ควบคุม
   จับเวลา = ตัวเลขใหญ่ชัด + แถบเวลา + ปุ่ม −1/+1/+5, หยุด/ต่อ, ยกเลิก · “–” ย่อลงเหลือการ์ดเล็ก (ย่อ/ขยายมีผลทุกจอ: จอฉายก็เปลี่ยนเป็นการ์ดเล็ก)
   ช่วง 10 วินาทีสุดท้ายและตอนหมดเวลา ป๊อปอัปจะเด้งกลับมาอัตโนมัติ
   ===================================================================== */
class Pop {
  constructor(root, o) {
    this.o = o; this.hid = {}; this.vis = new Set(); this.sig = '';
    const el = this.el = document.createElement('div'); el.className = 'pop-layer ' + (o.cls || ''); root.appendChild(el);
    el.onclick = e => this.click(e); this.iv = setInterval(() => this.tick(), 250); this.tick(true);
  }
  destroy() { clearInterval(this.iv); this.el.remove(); if (Pop.host === this) Pop.host = null; }
  static shown(k) { return !!(Pop.host && Pop.host.vis.has(k)); }
  w() { try { return this.o.getW() || {}; } catch (e) { return {}; } }
  left(t) { return t.paused ? t.left : (t.end - Date.now()) / 1000; }

/* =====================================================================
   DevGate — ด่านอนุญาตอุปกรณ์: จอฉาย/รีโมท/มิเรอร์ ที่ใส่รหัสห้องเข้ามา ต้องให้ครูกดอนุญาตก่อน
   (รหัสห้องอยู่ใน QR ที่นักเรียนสแกน — ถ้าไม่มีด่านนี้ ใครรู้รหัสก็สลับเป็น ?remote= แล้วคุมกระดานครูได้)
   ===================================================================== */
const DevGate = {
  key: '',
  box() { let b = $('#devGate'); if (!b) { b = document.createElement('div'); b.id = 'devGate'; b.className = 'hide'; b.onclick = e => { const a = e.target.closest('[data-a]'), row = e.target.closest('.dg'); if (!a || !row) return; const s = Live.students.get(row.dataset.id); if (s && s.gated) this[a.dataset.a](s); }; document.body.appendChild(b); } return b; },
  roleLabel(r) { return r === 'display' ? T('จอฉาย', 'Display') : r === 'mirror' ? T('มิเรอร์', 'Mirror') : T('รีโมทปากกา / iPad', 'Pen remote / iPad'); },
  draw() {
    const ps = [...Live.students.values()].filter(x => x.gated), key = ps.map(x => x.id).join('|');
    if (key === this.key) return; const b = this.box(); const added = ps.some(x => !this.key.includes(x.id)); this.key = key;
    b.classList.toggle('hide', !ps.length);
    b.innerHTML = ps.map(s => `<div class="dg" data-id="${esc(s.id)}"><div><b>🔔 ${esc(s.label || s.name)}</b> <span class="chip pk">${this.roleLabel(s.role)}</span></div><div class="tiny muted" style="margin-top:4px">${T('ขอเชื่อมต่อด้วยรหัสห้อง — เป็นอุปกรณ์ของคุณหรือไม่?', 'Wants to join with the room code — is this your device?')}</div><div class="row"><button class="btn sm pri" data-a="ok">${T('อนุญาต', 'Allow')}</button><button class="btn sm" data-a="always" title="${T('ครั้งต่อไปไม่ต้องถามอีก', 'Do not ask again for this device')}">${T('อนุญาตเสมอ', 'Always')}</button><button class="btn sm danger" data-a="no">${T('ไม่อนุญาต', 'Deny')}</button></div></div>`).join('');
    if (added) { try { navigator.vibrate && navigator.vibrate(60); } catch (e) { } }
  },
  ok(s, always) {
    if (always && s.did) { DB.settings.trustDev = DB.settings.trustDev || {}; DB.settings.trustDev[s.did] = { label: s.label || s.name, role: s.role, ts: Date.now() }; save(); }
    Live._admit(s, {}, null); toast('✔ ' + (s.label || s.name) + ' ' + T('เชื่อมต่อแล้ว', 'connected'), 'ok', 1800);
  },
  always(s) { this.ok(s, true); },
  no(s) {
    try { s.conn.send({ t: 'denied', why: 'no' }); } catch (e) { }
    if (s.did) Live.banned.set('d:' + s.did, Date.now() + 600000);
    Live.students.delete(s.id); setTimeout(() => { try { s.conn.close(); } catch (e) { } }, 250); Live.emit();
  }
};

/* =====================================================================
   Mirror (ฝั่งครู) — รับภาพสดจากอุปกรณ์ (WebRTC) เก็บเป็นสตรีม แล้วให้หน้า SCREEN MIRRORING
   และหน้าต่างใน Studio ใช้ร่วมกัน · มีทั้งอุปกรณ์ระยะไกล (?mirror=) และ "หน้าต่างบนคอมนี้" (AirPlay/USB)
